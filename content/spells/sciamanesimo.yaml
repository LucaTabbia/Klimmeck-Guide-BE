# Magie dello sciamanesimo (D-15): preghiere e riti rivolti alle divinità che concedono un potere limitato sugli elementi naturali

- id: '6ae7fd90c38631a8efd3f730'
  name: Richiamo della fiamma ancestrale
  description: |-
    Lo sciamano intona la preghiera più antica delle tribù draconiche e chiede agli dei di prestargli il fuoco dei primi giorni. Una vampa si leva dal suolo e investe i nemici come il soffio di un antenato. Lo sciamanesimo fu la prima magia del continente e questa invocazione ne conserva tutta la ferocia.
  useType: attack
  energyDamage:
    type: fire
    power: 1100
  requiredLearnTime: 150000
  minXpToLearn: 12000
  recoveryTime: 15000
  maxUsages: 3
- id: '6ae7fd90c38631a8efd3f731'
  name: Soffio del gelo dei monti
  description: |-
    Un rito degli Aarakocra delle vette, che invocano il vento gelido delle cime per piegare chi minaccia la tribù. L'aria si fa ghiaccio attorno al bersaglio e ne rallenta ogni passo. Il potere sugli elementi resta limitato, ma basta a fermare una carica.
  useType: control
  energyDamage:
    type: cold
    power: 600
  requiredLearnTime: 80000
  minXpToLearn: 6000
  recoveryTime: 18000
  maxUsages: 3
- id: '6ae7fd90c38631a8efd3f732'
  name: Tuono degli antenati
  description: |-
    Lo sciamano batte il tamburo rituale e chiama a raccolta le voci degli antenati della tribù. Il loro grido si abbatte sui nemici come un tuono che scuote il terreno. È una preghiera che pochi osano recitare, perché gli dei non rispondono a chi la usa con leggerezza.
  useType: attack
  energyDamage:
    type: thunder
    power: 1400
  requiredLearnTime: 190000
  minXpToLearn: 20000
  recoveryTime: 30000
  maxUsages: 2
- id: '6ae7fd90c38631a8efd3f733'
  name: Preghiera della terra madre
  description: |-
    Una preghiera di protezione rivolta alle divinità della terra: la luce sale dal suolo e avvolge lo sciamano e i suoi compagni. I colpi nemici si smorzano contro il bagliore come contro una roccia. Le tribù la recitano prima di ogni battaglia e di ogni lungo viaggio.
  useType: defense
  energyDamage:
    type: radiant
    power: 900
  requiredLearnTime: 120000
  minXpToLearn: 15000
  recoveryTime: 30000
  maxUsages: 2
- id: '6ae7fd90c38631a8efd3f734'
  name: Spirito guida
  description: |-
    Con un rito semplice lo sciamano evoca un piccolo elementale che lo accompagna e gli presta forza e prontezza. È la prima invocazione insegnata ai giovani delle tribù draconiche e aarakocra. Lo spirito svanisce quando la preghiera si esaurisce.
  useType: enhance
  energyDamage:
    type: enhancing
    power: 500
  requiredLearnTime: 60000
  minXpToLearn: 4000
  recoveryTime: 15000
  maxUsages: 4
