# Magie del Vuoto (D-15): il potere del caos dei Diavoli, fatto di maledizioni, patti vincolanti e bolle di caos

- id: '6ae7fd90c38631a8efd3f735'
  name: Maledizione del Vuoto
  description: |-
    Un simbolo del caos inciso su un oggetto o su una persona diventa un portale da cui il Vuoto si riversa sulla vittima. La mente del maledetto si annebbia e i suoi gesti si fanno incerti. Gli Umani che tentano di lanciarla rischiano di esserne travolti per primi.
  useType: confuse
  energyDamage:
    type: necrotic
    power: 900
  requiredLearnTime: 120000
  minXpToLearn: 18000
  recoveryTime: 30000
  maxUsages: 2
- id: '6ae7fd90c38631a8efd3f736'
  name: Sussurro dei Diavoli
  description: |-
    Senza parole né gesti, chi padroneggia il Vuoto insinua i propri desideri più oscuri nella mente altrui. La vittima ascolta una voce che le sembra la sua e obbedisce. È l'arte con cui i Diavoli piegano i mortali da secoli.
  useType: charm
  energyDamage:
    type: psychic
    power: 500
  requiredLearnTime: 70000
  minXpToLearn: 10000
  recoveryTime: 20000
  maxUsages: 3
- id: '6ae7fd90c38631a8efd3f737'
  name: Bolla di caos
  description: |-
    Il caos contenuto nell'incantatore si condensa in una sfera tremolante che scoppia in mezzo ai nemici. Tutto ciò che si trova nei paraggi viene schiacciato e trattenuto dalla distruzione che ne esce. Solo chi possiede insieme molto caos e un poco di ordine riesce a non esserne inghiottito.
  useType: control
  energyDamage:
    type: force
    power: 1200
  requiredLearnTime: 160000
  minXpToLearn: 28000
  recoveryTime: 45000
  maxUsages: 1
- id: '6ae7fd90c38631a8efd3f738'
  name: Patto dell'Abisso
  description: |-
    Un patto vincolante stretto col Vuoto in cambio di un frammento d'anima. Le armi di chi lo stipula si impregnano di un'energia che consuma la vita del bersaglio. L'Abisso dei Diavoli non dimentica mai un debito.
  useType: infuse
  energyDamage:
    type: necrotic
    power: 1000
  requiredLearnTime: 130000
  minXpToLearn: 22000
  recoveryTime: 35000
  maxUsages: 2
- id: '6ae7fd90c38631a8efd3f739'
  name: Marchio infernale
  description: |-
    Il simbolo del Vuoto viene impresso a fuoco sul nemico e ne fa un portale per le fiamme dell'Abisso. Il marchio brucia dall'interno finché il potere non si esaurisce. Lo padroneggiano soltanto pochi Diavoli di grande potere, e i Lich più antichi.
  useType: attack
  energyDamage:
    type: fire
    power: 2000
  requiredLearnTime: 180000
  minXpToLearn: 38000
  recoveryTime: 60000
  maxUsages: 1
