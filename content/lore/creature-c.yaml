# Creature C (D-09, D-23): una lore enemy per scheda di mostro del documento, da Minotauro a Vampiro

- id: '6ae804947fe539950fad17b8'
  type: enemy
  name: Minotauro
  description: |-
    Creature dal corpo di un umano muscoloso e dalla testa di un toro sbuffante, nate secoli fa da una maledizione divina e disprezzate dalle razze civilizzate. Molti minotauri moderni rifiutano quelle leggende e si credono modelli di perfezione creati dal crudele signore dei demoni Baphomet. Si annidano nei labirinti, soprattutto nei dedali di caverne del Lamstone chiamati Vene della madre e nelle antiche rovine, dove danno lentamente la caccia a chi si perde. Caricano a testa bassa con corna e forza bruta o brandiscono armi enormi, e sono molto resistenti.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f54' # Regno della Madre
- id: '6ae804947fe539950fad17b9'
  type: enemy
  name: Nothic
  description: |-
    Umanoidi curvi e deformi dall'andatura goffa, con un grande occhio unico che domina il viso. Vivono sottoterra, in rovine, segrete e caverne. Hanno artigli, ma non sono abili a usarli: preferiscono restare a distanza e fissare le vittime con uno sguardo che fa marcire i tessuti. Sanno anche leggere nella mente dei bersagli per carpirne i segreti.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
- id: '6ae804947fe539950fad17ba'
  type: enemy
  name: Ogre
  description: |-
    Giganti goffi dagli occhietti privi di intelligenza e dalla faccia paffuta, con una bocca piena di denti storti, che godono della sofferenza altrui e non conoscono tabù. L'unica cosa che rispettano è la famiglia: le loro tribù si chiamano così e sono guidate da un padre o, a volte, da una madre. Le famiglie litigano di continuo fra loro, finché un patriarca temuto non le unisce e le scatena sui vicini. Vivono nello squallore sulle isole Harken e nell'estremo nord del continente, e combattono con armi rudimentali e forza fisica.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5e' # Harken
    - '6ae7fc3ed1f6494f3dc89f63' # Lontano Nord
- id: '6ae804947fe539950fad17bb'
  type: enemy
  name: Troll
  description: |-
    Creature gobbe alte circa quattro metri, dalla pelle verde e coriacea, con mani artigliate e un muso bestiale irto di zanne; un adulto pesa circa mezza tonnellata. La loro rigenerazione guarisce quasi ogni ferita, e perfino da un arto mozzato può rinascere un troll completo. Vivono sulle colline a nord del continente e nelle pianure attorno al Temistos. Caricano la creatura vivente più vicina con armi rudimentali e forza bruta, e solo il fuoco o l'acido, o la testa e il cuore distrutti, li uccidono per sempre.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
- id: '6ae804947fe539950fad17bc'
  type: enemy
  name: Orsogufo
  description: |-
    Bizzarra mostruosità di piume e pelo, mezza orso e mezza gufo, creata forse da un mago folle e poi capace di riprodursi da sola. È un predatore selvaggio e irascibile che attacca tutto ciò che si muove, con occhi iniettati di sangue che ruotano poco prima della carica. Abita le zone più interne dei boschi e fa la tana in foreste intricate o in caverne buie vicino alla superficie. Caccia di giorno e di notte, con forza tremenda, becco e artigli.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
- id: '6ae804947fe539950fad17bd'
  type: enemy
  name: Viverna
  description: |-
    Rettili brutali dalle ali immense e dalla coda munita di un pungiglione uncinato, lontani parenti dei draghi che le guardano dall'alto in basso come selvaggi primitivi. Sempre aggressive e impazienti, preferiscono combattere prima e discutere poi. Sono solitarie e territoriali, con terreni di caccia vastissimi che si contendono fino alla morte. Vivono sul Belleholm e sul Temistos e attaccano in volo con morsi, artigli e un pungiglione la cui tossina uccide in fretta chi non viene curato.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
- id: '6ae804947fe539950fad17be'
  type: enemy
  name: Scheletro
  description: |-
    Ossa di morti riportate alla non vita da magie sacrileghe. Sono automi privi di volontà, ma la forza che li anima concede loro un'astuzia malvagia sufficiente a portare armi e indossare armature. Si trovano sulle isole Harken e nel Glounet, nelle catacombe, nelle rovine e nelle segrete abbandonate. Combattono con le armi che portano al fianco.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5e' # Harken
    - '6ae7fc3ed1f6494f3dc89f5f' # Glounet
    - '6ae7ff6624214746ad54aee8' # Culto della morte
- id: '6ae804947fe539950fad17bf'
  type: enemy
  name: Segugio infernale
  description: |-
    Lupi alti e magri dalla pelliccia rosso bruna, con artigli bianchi e ardenti e feroci occhi rossi, alti fino a un metro e mezzo al garrese. Cacciano in branco: circondano la preda in silenzio e la spingono verso i compagni soffiando fiamme, e non smettono mai di inseguire chi fugge. Vivono sui vulcani del Belleholm, anche se alcuni ricchi eccentrici provano ad addomesticarli e li portano nei centri abitati. Combattono con zanne e artigli e sputano fuoco.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
- id: '6ae804947fe539950fad17c0'
  type: enemy
  name: Slaad
  description: |-
    Creature del caos simili a grandi rane bipedi, con lunghi artigli, bocche piene di denti appuntiti e una gemma del loro colore incastonata nel teschio, incisa con i segni delle loro conquiste. Non ce ne sono due identici, e il colore della gemma distingue rossi, blu, verdi e grigi. Vivono in piccole comunità nelle Paludi maledette e combattono quasi sempre uno contro uno, rigenerandosi da colpi quasi mortali. I verdi lanciano palle e lingue di fuoco e diventano invisibili; i grigi sanno anche cambiare piano, assumere forma umanoide, volare e terrorizzare.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f64' # Paludi maledette
    - '6ae7ff6624214746ad54aeeb' # Culto del caos
- id: '6ae804947fe539950fad17c1'
  type: enemy
  name: Treant
  description: |-
    Alberi animati i cui nodi della corteccia disegnano una forma vagamente umana, antichi quanto le foreste che custodiscono come genitori e pastori. Sono lenti e metodici, tollerano chi vuole imparare dai loro lunghi monologhi, ma la loro furia contro boscaioli e costruttori di strade è rapida e devastante. Vivono solitari nei boschi di tutto il continente, e un solo treant veglia spesso su un'intera foresta. Colpiscono con gli arti, animano fino a due alberi vicini, scagliano massi enormi e caricano chi vogliono travolgere.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
    - '6ae7ffd05fa3295e56e4dc38' # Enayr, la Dea della natura
    - '6ae7ffd05fa3295e56e4dc39' # Culto dell'armonia
- id: '6ae804947fe539950fad17c2'
  type: enemy
  name: Umber Hulk
  description: |-
    Creature insettoidi a metà fra un gorilla e un coleottero, dal carapace durissimo, con artigli possenti e un'enorme mandibola. Vivono nelle caverne più profonde, dove scavano tunnel e percepiscono anche il più lieve movimento del suolo. Sbucano all'improvviso sotto le vittime e le dilaniano. I loro occhi color rubino gettano chi li guarda in una confusione profonda, a volte fino alla follia.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
- id: '6ae804947fe539950fad17c3'
  type: enemy
  name: Wraith
  description: |-
    Figure spettrali e oscure con due puntini di luce tremolante al posto degli occhi, nate dal male e dall'oscurità. Detestano la luce e i viventi, e hanno perso quasi ogni legame con la vita precedente. Si aggirano sugli antichi campi di battaglia, nelle pianure poco frequentate, nelle catacombe e, numerosi, sulle isole Glounet. Il loro tocco gelido risucchia la vita; solo la magia e le armi magiche li feriscono, e alla luce del sole si indeboliscono.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5f' # Glounet
    - '6ae7ff6624214746ad54aee8' # Culto della morte
- id: '6ae804947fe539950fad17c4'
  type: enemy
  name: Yeti
  description: |-
    Creature che camminano come persone, grandi una volta e mezza un uomo e coperte di pelo bianco: gli abominevoli uomini delle nevi dei racconti di montagna. Vivono in piccole tribù sui picchi più a nord del continente, lontani dalle altre razze, e raramente scendono sulle pendici. I più sanguinari vengono esiliati e razziano bestiame e persone negli insediamenti a valle. Il loro tocco gelido congela, e la loro forza squarta gli avversari.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f63' # Lontano Nord
- id: '6ae804947fe539950fad17c5'
  type: enemy
  name: Cane della morte
  description: |-
    Cani a due teste dal pelo nero e sporco, grandi quanto un cavallo, con occhi neri come la pece e una nidiata di vermi che striscia fra il pelo. Si credono cadaveri animati dai cultisti, ma sono creature vive che convivono con i vermi carnivori nati dalle uova della loro saliva. Cacciano di notte in branco sulle isole Glounet, circondano le prede più forti e le sfiancano attaccando a turno. I loro morsi infestano di vermi chi li subisce, e anche il loro cadavere resta contagioso per giorni.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5f' # Glounet
- id: '6ae804947fe539950fad17c6'
  type: enemy
  name: Ragno fase
  description: |-
    Grandi mostri simili a ragni, con un macabro volto umanoide circondato da una criniera spelacchiata. Sono predatori del Piano Etereo che cacciano sul piano materiale e preparano le imboscate passando da un piano all'altro. Vivono soprattutto in grandi caverne e grotte. Mordono la vittima con un veleno potente, provano ad afferrarla e poi svaniscono nel piano etereo per sfuggire ai colpi.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
    - '6ae7fc3ed1f6494f3dc89f6a' # La creazione dei piani e delle prime razze
- id: '6ae804947fe539950fad17c7'
  type: enemy
  name: Megera verde
  description: |-
    Streghe malevole dall'aspetto di vecchie rugose, che odiano tutto ciò che è bello e puro e si dilettano a corrompere i nobili d'animo. Si camuffano spesso da ragazze giovani e attraenti per sedurre gli uomini, rovinarne la vita e infine divorarli. Si incontrano ovunque, soprattutto camuffate nei luoghi abitati, ma i loro covi sono grotte o capanne in posti isolati come le Paludi maledette. Attaccano con artigli che indeboliscono e creano illusioni, e tre megere insieme formano una congrega dai poteri magici maggiori.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f64' # Paludi maledette
- id: '6ae804947fe539950fad17c8'
  type: enemy
  name: Goblin
  description: |-
    Razza intelligente abbastanza da fondare piccoli villaggi e costruire strutture, utensili, armi e armature, ma considerata alla stregua dei mostri per la sua natura violenta e maligna. Assaltano i villaggi umani in cerca di provviste sfruttando il loro numero, e sono fra le razze più odiate del continente; vivono in media fino a cinquant'anni, e alcuni praticano la magia sciamanica. Abitano grotte e sotterranei, montagne, pianure poco frequentate e spiagge, e si dice che nel Glounet abbiano costruito vere città. Attaccano in gruppo con le loro armi, spesso in sella ai worg.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f5f' # Glounet
    - '6ae7ff6624214746ad54aeeb' # Culto del caos
    - '6ae8001b906eac0adda59a43' # Vozaed Ferroscuro
- id: '6ae804947fe539950fad17c9'
  type: enemy
  name: Hobgoblin
  description: |-
    Goblinoidi militaristi e prolifici, alti un metro e mezzo, molto più civilizzati dei goblin, che guardano con un misto di vergogna e frustrazione. Dichiarano guerra per un nonnulla, soprattutto per catturare schiavi, e rimpiazzano in fretta i caduti; costruiscono macchine d'assedio e praticano l'alchimia. Vivono sulle colline del nord, nelle grandi pianure meridionali e sulle isole del Belleholm, e si dice che nel Glounet abbiano fondato vere città. Attaccano in gruppo con le loro armi, a volte a cavallo o con armi d'assedio, e alcuni usano la magia sciamanica.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
    - '6ae7fc3ed1f6494f3dc89f62' # Pianure dei Valan
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f5f' # Glounet
    - '6ae7ffd05fa3295e56e4dc3f' # Culto della guerra
    - '6ae8001b906eac0adda59a43' # Vozaed Ferroscuro
- id: '6ae804947fe539950fad17ca'
  type: enemy
  name: Ghoul
  description: |-
    Non morti necrofagi che frequentano i cimiteri e si cibano dei cadaveri, preferibilmente in putrefazione; la loro vera origine, fra cannibali maledetti e vittime di un'orrenda malattia, resta incerta. Si appostano ai margini della civiltà, nei cimiteri e nelle fogne cittadine. Si dice che a Necrorian, nel Glounet, vivano ghoul civilizzati sotto il comando dei lich, non meno orrendi nei loro banchetti. Mordono e graffiano con artigli velenosi che paralizzano.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5f' # Glounet
    - '6ae7fc3ed1f6494f3dc89f57' # Necrorian e il Glounet
    - '6ae8001b906eac0adda59a3f' # Orgeal Indrek, il Dio dei morti
- id: '6ae804947fe539950fad17cb'
  type: enemy
  name: Progenie vampirica
  description: |-
    Vittime che un vampiro ha ucciso succhiandone il sangue e trasformato in servitori, anziché in vampiri completi. Vivono nei centri abitati e nelle caverne governate dai loro padroni. Succhiano il sangue, si rigenerano, diventano nube di gas per sfuggire ai colpi, ammaliano le prede e si arrampicano sui muri come ragni. Temono il sole, l'acqua corrente, i paletti di legno, l'aglio e i simboli sacri, e non entrano in una casa senza invito.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f7e' # Il Vuoto e l'Abisso dei Diavoli
    - '6ae7fc3ed1f6494f3dc89f6c' # La seconda era
- id: '6ae804947fe539950fad17cc'
  type: enemy
  name: Vampiro
  description: |-
    Esseri maledetti identici agli umani, se non per i capelli bianchi, gli occhi rosso sangue e spesso i segni del morso sul collo; non proiettano ombra e si muovono in silenzio. Si nutrono di sangue umano, traggono potere da quello che bevono e occupano spesso posizioni di potere fra gli umani grazie al talento nell'ammaliare le menti. Vivono nei centri abitati e nelle caverne che governano, e solo i vampiri originali trasmettono la maledizione. Dominano le prede, si mutano in lupi o pipistrelli, evocano sciami e branchi e conoscono le arti magiche, ma temono il sole, l'acqua corrente, i paletti, l'aglio e i simboli sacri.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f7e' # Il Vuoto e l'Abisso dei Diavoli
    - '6ae7fc3ed1f6494f3dc89f6c' # La seconda era
    - '6ae8001b906eac0adda59a4c' # Solomon Quill
