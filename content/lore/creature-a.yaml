# Creature A (D-09, D-23): una lore enemy per scheda di mostro del documento, da Aboleth a Lung Wang giovane

- id: '6ae8018831ec3185a9e09920'
  type: enemy
  name: Aboleth
  description: |-
    Anfibi lunghi sette metri, a metà fra pesce e anguilla, con il corpo segmentato come quello di un verme, tre occhi impilati sopra il becco e quattro lunghi tentacoli vicino alla testa. Si credono fra i primi esseri del mondo e vedono nelle razze giovani dei ladri di ciò che spetta a loro per diritto. Abitano i laghi sotterranei e gli oceani, a volte le Paludi maledette, e ad ovest di Liberia vengono avvistati spesso. Colpiscono con i tentacoli e con poteri psichici; sott'acqua si ricoprono di un muco che fa ammalare chi lo tocca.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
    - '6ae7fc3ed1f6494f3dc89f64' # Paludi maledette
    - '6ae7fc3ed1f6494f3dc89f66' # Oceano Ladows
    - '6ae7fc3ed1f6494f3dc89f67' # Oceano Delants
    - '6ae7fc3ed1f6494f3dc89f5d' # Calemark
- id: '6ae8018831ec3185a9e09921'
  type: enemy
  name: Ankheg
  description: |-
    Un enorme insetto dalle molte zampe, con lunghe antenne che fremono a ogni movimento intorno a sé. Vive pochi anni, in sciami comandati da una regina. Si incontra nelle grandi pianure e nelle foreste del continente, e qualche piccolo sciame infesta le isole meno battute di Liberia. Le zampe uncinate scavano e afferrano, e le mandibole spezzano a metà un piccolo albero.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
    - '6ae7fc3ed1f6494f3dc89f62' # Pianure dei Valan
    - '6ae7fc3ed1f6494f3dc89f5d' # Calemark
- id: '6ae8018831ec3185a9e09922'
  type: enemy
  name: Arpia
  description: |-
    Considerate streghe della natura, le arpie possono essere sorprendentemente attraenti, con ali che sono al tempo stesso le loro braccia e piumaggi neri, blu, verdi o bianchi. Raramente usano armi: si affidano agli artigli e al canto. Con la loro canzone ammaliano i viandanti e li conducono al loro destino. Nidificano sui monti del continente e attaccano dall'alto, in volo.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
- id: '6ae8018831ec3185a9e09923'
  type: enemy
  name: Banshee
  description: |-
    Uno spirito carico d'odio nato dall'anima di un'elfa, con capelli selvaggi e stracci eterei che le fluttuano intorno. Resta legata al mondo dalla vendetta o da ciò che non è riuscita a compiere prima di morire. Infesta la foresta del Minnely, soprattutto gli antichi cimiteri abbandonati. Il suo urlo è mortale.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
- id: '6ae8018831ec3185a9e09924'
  type: enemy
  name: Basilisco
  description: |-
    Un predatore corpulento che non ha bisogno di inseguire la preda: il suo sguardo soprannaturale ne trasforma la carne in pietra porosa. Con le possenti mascelle si nutre di quella pietra, che torna materia viva una volta inghiottita. Ama i climi aridi e tropicali e fa la tana in caverne e luoghi riparati. Vive sulle isole del Belleholm e, più raramente, nei pochi punti solidi del Mar sabbioso.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
- id: '6ae8018831ec3185a9e09925'
  type: enemy
  name: Beholder
  description: |-
    Una testa fluttuante con un unico grande occhio, dieci peduncoli oculari e fauci enormi sempre spalancate. Vive soltanto nelle caverne più vaste sotto i Lamstone, e nella sua tana è molto più forte. Quando dorme la realtà si piega nel raggio di un chilometro e mezzo: segni che cambiano, monili che compaiono dal nulla, la sensazione di essere osservati. I suoi raggi stordiscono, pietrificano, ammaliano e uccidono sul colpo, e le pareti della tana gli obbediscono.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
- id: '6ae8018831ec3185a9e09926'
  type: enemy
  name: Belva distorcente
  description: |-
    Sembra una pantera emaciata dalla pelliccia nero-blu, con sei zampe e due tentacoli spinosi che le crescono dal dorso. È un carnivoro furtivo grande come una tigre, che considera preda qualunque creatura incontri. Parla il Comune ed è difficilissima da individuare. Caccia nelle foreste del continente e sulle isole del Glounet, colpendo con tentacoli, zanne e artigli.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5f' # Glounet
- id: '6ae8018831ec3185a9e09927'
  type: enemy
  name: Bulette
  description: |-
    Lo squalo di terra: un predatore gigantesco e irascibile che vive solo per mangiare e non teme nessuno. Scava tunnel con gli artigli, sradica alberi e provoca frane, lasciando voragini al suo passaggio. Quando sente vibrare il terreno sfreccia in superficie a fauci spalancate. Infesta le colline del nord del continente e scende fino ai piedi del Temistos e alle pianure intorno.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
- id: '6ae8018831ec3185a9e09928'
  type: enemy
  name: Chimera
  description: |-
    Una vile combinazione di capra, leone e drago, con le teste di tutte e tre le creature. Ama piombare dal cielo e investire la preda con l'alito infuocato prima di atterrare per finirla. Attacca con il fuoco, le fauci, le corna e gli artigli. Vive soprattutto sulle isole di Harken e del Glounet.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5e' # Harken
    - '6ae7fc3ed1f6494f3dc89f5f' # Glounet
- id: '6ae8018831ec3185a9e09929'
  type: enemy
  name: Chuul
  description: |-
    Grandi aberrazioni simili ad aragoste che odiano gli umanoidi della superficie. I tentacoli intorno alla bocca paralizzano con un solo tocco e lasciano la vittima in balia delle chele. Abitano i grandi laghi e le Paludi maledette.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5a' # Lago Nanfail e Hingtos
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f64' # Paludi maledette
- id: '6ae8018831ec3185a9e0992a'
  type: enemy
  name: Cumulo strisciante
  description: |-
    Un ammasso di foglie e rampicanti dalla forma vagamente umana, senza testa, alto quasi due metri: sembra vegetazione marcia, ma è una pianta intelligente e carnivora. Nel suo ambiente è silenzioso e quasi invisibile, e attende immerso negli stagni che qualcuno gli passi sopra. I viandanti giurano di averne visti camminare nelle tempeste senza curarsi dei fulmini che li colpivano. Vive nelle pozze e nei laghi del Belleholm e nelle Paludi maledette, e cerca di inglobare la preda per stritolarla.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f64' # Paludi maledette
- id: '6ae8018831ec3185a9e0992b'
  type: enemy
  name: Demone d'ombra
  description: |-
    Molte storie di possessione sono solo follia, ma alcune sono opera dei demoni d'ombra. Nascono da un'anima mortale invidiosa e malvagia che si divide e si fonde con altre anime fino a riemergere come pura malevolenza, senza corpo. Incorporei, si colpiscono solo con armi magiche o incantesimi; temono la luce del sole e al buio diventano invisibili. Si nascondono nei centri abitati o ovunque vengano evocati, possiedono i viventi e colpiscono con artigli d'ombra.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f7e' # Il Vuoto e l'Abisso dei Diavoli
    - '6ae8001b906eac0adda59a4b' # Jur'gath, il signore dei demoni
- id: '6ae8018831ec3185a9e0992c'
  type: enemy
  name: Hezrou
  description: |-
    Mostruosità demoniache alte due metri e mezzo, simili a enormi rospi in forma umanoide, con mani al posto delle zampe anteriori e una fila di aculei lungo la schiena. Nelle fauci hanno file di denti smussati capaci di schiacciare qualsiasi cosa. Camminano su due piedi o a quattro zampe, ma combattono sempre eretti, con artigli e zanne. Si incontrano nelle caverne antiche sotto i Lamstone e presso i portali demoniaci.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f7e' # Il Vuoto e l'Abisso dei Diavoli
    - '6ae8001b906eac0adda59a4b' # Jur'gath, il signore dei demoni
- id: '6ae8018831ec3185a9e0992d'
  type: enemy
  name: Quasit
  description: |-
    Piccoli umanoidi di mezzo metro dalla pelle verde coperta di verruche, con corna, una coda pelosa e dita lunghe terminate da artigli; alcuni hanno ali da pipistrello. Fanno da spie ai demoni, nascosti nei centri abitati o vicino ai portali demoniaci. Preferiscono sparire nell'invisibilità o trasformarsi in piccoli animali piuttosto che combattere. I loro artigli, velocissimi, iniettano un veleno che brucia.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f7e' # Il Vuoto e l'Abisso dei Diavoli
- id: '6ae8018831ec3185a9e0992e'
  type: enemy
  name: Imp
  description: |-
    Piccoli quanto i quasit, di solito rosso scuro, con ali coriacee da pipistrello, corna contorte e zanne di un bianco brillante. La coda prensile termina con un pungiglione velenoso. Sono resistenti ma poco forti: volano, diventano invisibili e si trasformano in piccoli animali. Si trovano vicino ai portali demoniaci.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f7e' # Il Vuoto e l'Abisso dei Diavoli
- id: '6ae8018831ec3185a9e0992f'
  type: enemy
  name: Doppelganger
  description: |-
    Nella loro vera forma sono umanoidi alti ed elfici, dalla pelle grigia e glabra, con teste bulbose, volti informi e occhi giallo pallido senza pupille. Sembrano fragili, ma sono forti e agili. Vivono nascosti nei centri abitati con il volto di altri e leggono nel pensiero. Combattono con le armi che portano o a mani nude, e resistono alle magie che addormentano o ammaliano.
  image: null
  relatedLore: []
- id: '6ae8018831ec3185a9e09930'
  type: enemy
  name: Drago d'ombra giovane
  description: |-
    Creature subdole e astute legate al Piano delle Ombre, con scaglie traslucide e corpi scuri che da lontano sembrano una massa d'ombre foriera di sventura. Solo un drago puro nato nella Coltre Oscura, o rimasto a lungo al suo interno, può diventarlo; un dracolich, che ha perso la natura draconica, mai. Vive soltanto nelle profondità della terra e sul Glounet. Il suo respiro porta la necrosi e chi uccide diventa un'ombra al suo servizio; nell'oscurità nessuna magia lo tocca, se non quella della luce.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5f' # Glounet
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
- id: '6ae8018831ec3185a9e09931'
  type: enemy
  name: Draghi cucciolo e giovani
  description: |-
    I draghi sono fra le razze più antiche e potenti del mondo; i più comuni sono i metallici e i cromatici, e il colore delle scaglie ne decide il carattere e il soffio. Pochi draghi rossi e di rame vivono nei vulcani del Belleholm, quelli d'argento nei Lamstone e nelle colline vicine. Si dice che nel deserto viva anche qualche drago blu, ma se ne conosce uno soltanto. Anche giovani attaccano con artigli, fauci, coda, ali e soffio, e terrorizzano chiunque li affronti.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
    - '6ae8001b906eac0adda59a44' # Amaerith, il fuoco rosso
- id: '6ae8018831ec3185a9e09932'
  type: enemy
  name: Driade
  description: |-
    Esseri misteriosi e selvaggi che abitano il cuore dei boschi più isolati e difendono gli alberi da chiunque voglia abbatterli. Hanno i lineamenti di una giovane elfa, la pelle simile alla corteccia e capelli di foglie che cambiano colore con le stagioni. Parlano con gli animali e li fanno loro alleati, passano da un albero all'altro con un tocco, ammaliano e addormentano gli intrusi. Spesso li mandano a risolvere le minacce che da sole non possono affrontare.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
    - '6ae7ffd05fa3295e56e4dc38' # Enayr, la Dea della natura
    - '6ae7ffd05fa3295e56e4dc39' # Culto dell'armonia
- id: '6ae8018831ec3185a9e09933'
  type: enemy
  name: Lung Wang giovane
  description: |-
    Un drago del mare con il corpo di tartaruga, un guscio di spesse scaglie verdi macchiate d'argento, testa da lucertola, lunghi baffi dorati e piccole corna nere. Si nutre soprattutto di alghe, pesce e minerali, ma è noto per aver divorato navi intere. Non vola e non colpisce con coda o ali, eppure è un avversario temibile: ribalta le navi per esporre l'equipaggio. Vive nei due oceani e attacca con artigli, zanne e un getto di vapore che si fa più potente con l'età.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f66' # Oceano Ladows
    - '6ae7fc3ed1f6494f3dc89f67' # Oceano Delants
