# Culti di Klimmeck, parte 2 (D-23): per ogni culto la divinità (god), il credo (religion) e le feste (ceremony); i quattro dei della fortuna sono una sola terna

- id: '6ae7ffd05fa3295e56e4dc29'
  type: god
  name: Mirwa, la Dea delle acque
  description: |-
    Mirwa è una ninfa d'acqua dai lunghi capelli arancioni, vestita di una tunica bianca e larga, quasi trasparente. La tiara che porta sul capo indica la nobiltà del donare la vita. Fra i palmi le cresce un fiore di Lacrime della vergine, il suo simbolo.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc2a' # Culto della vita
    - '6ae7ffd05fa3295e56e4dc2b' # Il Ciclo della marea
    - '6ae7fc3ed1f6494f3dc89f69' # Le origini
- id: '6ae7ffd05fa3295e56e4dc2a'
  type: religion
  name: Culto della vita
  description: |-
    Il culto vede nell'acqua la fonte della vita e il simbolo del tempo che scorre, come un fiume che scava lentamente la roccia: i fedeli devono rispettare gli altri e donare loro felicità, nutrimento dell'anima. Per legge è l'unica fede della Teocrazia di Mirwa, ma la pregano in tutto il continente, soprattutto marinai e pescatori. La guida l'Alto Sacerdote, oggi Alander XXI, scelto personalmente dalla dea, e i suoi fedeli sono in contrasto con quelli di Naleala su chi abbia dato vita al mondo. I Templi della vita sorgono quasi ovunque ci sia acqua e Mirwa è una delle otto divinità del Tempio dei grandi otto di Liberia.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc29' # Mirwa, la Dea delle acque
    - '6ae7ffd05fa3295e56e4dc2b' # Il Ciclo della marea
    - '6ae7ffd05fa3295e56e4dc30' # Culto della madre
    - '6ae7fc3ed1f6494f3dc89f52' # Teocrazia di Mirwa
    - '6ae7fc3ed1f6494f3dc89f5a' # Lago Nanfail e Hingtos
    - '6ae7fc3ed1f6494f3dc89f55' # Liberia
    - '6ae8001b906eac0adda59a38' # Alexander Themoira XXI
- id: '6ae7ffd05fa3295e56e4dc2b'
  type: ceremony
  name: Il Ciclo della marea
  description: |-
    Ogni sei mesi i fedeli di Mirwa compiono il pellegrinaggio del Ciclo della marea fino al Grande Tempio dell'Origine di Mirwen, dove l'Alto Sacerdote tiene una settimana di funzioni e riferisce le parole della dea. Con la Cerimonia del viaggio il defunto viene affidato a una barca che le correnti portano al largo e che poi viene data alle fiamme. Nell'Incontro delle Acque, invece, gli sposi entrano nell'acqua e si scambiano un fiore di Lacrime della vergine.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc29' # Mirwa, la Dea delle acque
    - '6ae7ffd05fa3295e56e4dc2a' # Culto della vita
    - '68c19213541d89c481b8322f' # Mirwen
- id: '6ae7ffd05fa3295e56e4dc2c'
  type: god
  name: Lizdum, il Dio ferino
  description: |-
    Lizdum è un lupo mannaro dal pelo grigio, armato di spada e armatura leggera come si addice a un cacciatore. Una cicatrice sull'occhio destro ricorda che ognuno è al tempo stesso preda e predatore. I suoi occhi rossi come il sangue rappresentano il desiderio primordiale di cacciare e prevalere sulla preda.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc2d' # Culto delle bestie
    - '6ae7ffd05fa3295e56e4dc2e' # La Grande caccia
    - '6ae7fc3ed1f6494f3dc89f6a' # La creazione dei piani e delle prime razze
- id: '6ae7ffd05fa3295e56e4dc2d'
  type: religion
  name: Culto delle bestie
  description: |-
    Il culto venera gli animali e la comunione con loro: si caccia solo per sostentarsi e con reverenza, mentre l'allevamento è ripudiato perché ogni creatura deve seguire libera il proprio ciclo. I fedeli inseguono una vita più grezza e selvaggia, retta solo dalle leggi della natura, e credono di rinascere dopo la morte in forma animale. Lo seguono eremiti, Licantropi, Aarakocra e cacciatori, senza alcuna figura religiosa. È diffuso in tutto il continente e nelle isole, soprattutto al nord, nelle foreste e sulle montagne.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc2c' # Lizdum, il Dio ferino
    - '6ae7ffd05fa3295e56e4dc2e' # La Grande caccia
    - '6ae7fc3ed1f6494f3dc89f63' # Lontano Nord
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
- id: '6ae7ffd05fa3295e56e4dc2e'
  type: ceremony
  name: La Grande caccia
  description: |-
    Per il Culto delle bestie ogni caccia è una preghiera: della preda non si spreca nulla, perché la sua morte non sia vana. A ogni luna piena, quando i Licantropi si trasformano e i cacciatori vedono meglio nel buio, si tiene la Grande caccia. Quella notte ogni discepolo deve abbattere una preda forte e sfuggente per mostrare il proprio valore.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc2c' # Lizdum, il Dio ferino
    - '6ae7ffd05fa3295e56e4dc2d' # Culto delle bestie
- id: '6ae7ffd05fa3295e56e4dc2f'
  type: god
  name: Naleala, la Dea della terra
  description: |-
    Naleala è una nana dai capelli neri chiusa in un'armatura di ferro, segno che i frutti della terra vanno usati con rispetto e maestria. Stringe un grande martello da fabbro, con cui lavora i minerali e schiaccia chi non rispetta il suo dominio.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc30' # Culto della madre
    - '6ae7ffd05fa3295e56e4dc31' # Il Ritorno alla madre
    - '6ae7fc3ed1f6494f3dc89f69' # Le origini
    - '6ae7fc3ed1f6494f3dc89f6a' # La creazione dei piani e delle prime razze
- id: '6ae7ffd05fa3295e56e4dc30'
  type: religion
  name: Culto della madre
  description: |-
    Il culto venera la terra e le montagne come fonte di vita: dai monti nasce l'acqua, dalla terra le piante, e alla terra tutto ritorna. Rispettare la vita significa rispettarne i frutti e imparare a usarli, ed è uno dei culti più antichi del continente. È la fede di fabbri, Nani, minatori e contadini, e si dice anche dei Giganti; il suo capo spirituale è Skargen Monteaspro III, scelto dalla dea per il suo talento, e i suoi fedeli sono in contrasto con quelli di Mirwa. È il culto ufficiale del Regno della Madre, forte soprattutto sul Lamstone e attorno ai vulcani del Belleholm, e Naleala è una delle otto divinità del Tempio dei grandi otto di Liberia.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc2f' # Naleala, la Dea della terra
    - '6ae7ffd05fa3295e56e4dc31' # Il Ritorno alla madre
    - '6ae7ffd05fa3295e56e4dc2a' # Culto della vita
    - '6ae7fc3ed1f6494f3dc89f54' # Regno della Madre
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f55' # Liberia
    - '6ae7fc3ed1f6494f3dc89f6b' # La prima era
    - '6ae8001b906eac0adda59a39' # Skargen Monteaspro III
- id: '6ae7ffd05fa3295e56e4dc31'
  type: ceremony
  name: Il Ritorno alla madre
  description: |-
    Nel Ritorno alla madre i fedeli scavano nella roccia intonando una cantilena che sembra cantata dalla montagna stessa, poi seppelliscono il defunto a diretto contatto con la terra. L'Abbraccio della madre è il matrimonio celebrato nelle profondità della montagna, con un canto gioioso che la roccia porta a tutti. Fabbri e minatori intonano la Parola della madre ogni volta che iniziano a scavare o a lavorare i metalli.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc2f' # Naleala, la Dea della terra
    - '6ae7ffd05fa3295e56e4dc30' # Culto della madre
- id: '6ae7ffd05fa3295e56e4dc32'
  type: god
  name: Bitya, la Dea della ricchezza
  description: |-
    Bitya è una donna dai lunghi capelli dorati, con una corona che simboleggia il potere conquistato con le ricchezze e vesti preziose. Spesso la si raffigura con borselli pieni di gemme, perché la si venerava già prima della nascita della Liberica.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc33' # Culto della provvidenza
    - '6ae7ffd05fa3295e56e4dc34' # La Festa del raccolto
- id: '6ae7ffd05fa3295e56e4dc33'
  type: religion
  name: Culto della provvidenza
  description: |-
    Il culto vede nella ricchezza la fonte del potere e della felicità: la vita va vissuta nell'agio e i fedeli accumulano beni con ogni mezzo, ma alla morte devono donarli perché anche altri siano felici. Lo seguono mercanti, ambiziosi e gran parte dei ceti più ricchi, insieme ad alcuni ladri e capi di organizzazioni criminali. È diffuso soprattutto a Liberia e nelle grandi città, senza templi né figure religiose, solo con piccoli santuari domestici. È considerato un culto minore e raramente è l'unico del fedele.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc32' # Bitya, la Dea della ricchezza
    - '6ae7ffd05fa3295e56e4dc34' # La Festa del raccolto
    - '6ae7fc3ed1f6494f3dc89f55' # Liberia
    - '6ae7fc3ed1f6494f3dc89f71' # La Liberica e il cambio
- id: '6ae7ffd05fa3295e56e4dc34'
  type: ceremony
  name: La Festa del raccolto
  description: |-
    A fine anno i fedeli di Bitya celebrano con una festa intima ciò che hanno guadagnato. Offrono cibo e bevande ai propri cari, così da donare anche a loro la propria felicità.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc32' # Bitya, la Dea della ricchezza
    - '6ae7ffd05fa3295e56e4dc33' # Culto della provvidenza
- id: '6ae7ffd05fa3295e56e4dc35'
  type: god
  name: Ueyar, il Dio dell'altruismo
  description: |-
    Ueyar è un draconide dalle scaglie prismatiche che non ha ancora perso le ali, simbolo della libertà di chi non è schiavo dei beni materiali. Spesso lo si raffigura coperto di vegetazione, perché l'altruismo lascia agli altri la libertà di crescere come vogliono.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc36' # Culto della comunione
    - '6ae7ffd05fa3295e56e4dc37' # Feste del Culto della comunione
- id: '6ae7ffd05fa3295e56e4dc36'
  type: religion
  name: Culto della comunione
  description: |-
    Il culto vede nell'altruismo e nella semplicità la base del rispetto della vita: si vive senza superficialità, condividendo con il prossimo e considerando tutti uguali per creare comunità in armonia. Ne sono discepoli quasi tutti i Draconidi e molti piccoli villaggi di contadini, dove il senso di comunità è più forte, e raramente lo pratica un singolo. È diffuso soprattutto sul Lamstone e nei villaggi del nord, senza templi né figure religiose importanti, proprio per restare fedele all'uguaglianza.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc35' # Ueyar, il Dio dell'altruismo
    - '6ae7ffd05fa3295e56e4dc37' # Feste del Culto della comunione
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
    - '6ae7fc3ed1f6494f3dc89f7d' # Lo sciamanesimo
- id: '6ae7ffd05fa3295e56e4dc37'
  type: ceremony
  name: Feste del Culto della comunione
  description: |-
    Il Culto della comunione non ha feste e celebra soltanto gli atti di condivisione. I fedeli recitano a turno preghiere personali prima dei pasti o dopo un semplice gesto di bontà.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc35' # Ueyar, il Dio dell'altruismo
    - '6ae7ffd05fa3295e56e4dc36' # Culto della comunione
- id: '6ae7ffd05fa3295e56e4dc38'
  type: god
  name: Enayr, la Dea della natura
  description: |-
    Enayr è una driade dai lunghi capelli in cui piccoli animali fanno il nido. I suoi occhi azzurri come il cielo dicono che in lei si uniscono il creato terreno e quello celeste. La si raffigura spesso circondata da animali, perché anch'essi sono parte di lei.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc39' # Culto dell'armonia
    - '6ae7ffd05fa3295e56e4dc3a' # La Celebrazione della vita
    - '6ae7fc3ed1f6494f3dc89f69' # Le origini
    - '6ae7fc3ed1f6494f3dc89f6a' # La creazione dei piani e delle prime razze
- id: '6ae7ffd05fa3295e56e4dc39'
  type: religion
  name: Culto dell'armonia
  description: |-
    Il culto venera la natura e ogni forma di vita, il cui equilibrio perfetto non va mai sconvolto: raccogliere i frutti della terra è un atto di violenza da compiere ringraziando e chiedendo scusa. Enayr non è la fonte della vita ma la vita stessa, per questo i suoi fedeli non sono in contrasto con quelli di Naleala e di Mirwa; è uno dei culti più antichi del continente. Lo seguono druidi, Elfi, Treant, Driadi e contadini, guidati dai Capi druidi, pastori del loro Gregge. Le cerimonie si tengono ovunque, soprattutto nelle foreste, sotto gli Antichi abitanti, gli alberi più vecchi; Enayr è anche una delle otto divinità del Tempio dei grandi otto di Liberia.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc38' # Enayr, la Dea della natura
    - '6ae7ffd05fa3295e56e4dc3a' # La Celebrazione della vita
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
    - '6ae7fc3ed1f6494f3dc89f55' # Liberia
- id: '6ae7ffd05fa3295e56e4dc3a'
  type: ceremony
  name: La Celebrazione della vita
  description: |-
    A ogni nascita il neonato viene portato alle Driadi nel cuore della foresta perché la natura lo riconosca come suo, mentre la comunità balla e banchetta modestamente con gli animali. Nel matrimonio, detto Carezza della foresta, le Driadi legano per un momento le mani degli sposi con una radice in segno d'approvazione. I riti sono guidati dai Capi druidi.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc38' # Enayr, la Dea della natura
    - '6ae7ffd05fa3295e56e4dc39' # Culto dell'armonia
- id: '6ae7ffd05fa3295e56e4dc3b'
  type: god
  name: Edite, il Dio dei viandanti
  description: |-
    Edite è un anziano viandante dai lunghi capelli e dalla lunga barba, vestito in modo semplice e coperto da un mantello verde, simbolo del culto. Al suo fianco c'è spesso un pettirosso, segno della libertà di chi segue solo il proprio istinto. La sua somiglianza con Mobus fa pensare che un tempo fossero una cosa sola.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc3c' # Culto del cammino
    - '6ae7ffd05fa3295e56e4dc3d' # Feste del Culto del cammino
    - '6ae7ff6624214746ad54aeed' # Mobus, il Dio dell'ordine
    - '6ae7fc3ed1f6494f3dc89f6c' # La seconda era
    - '6ae7fc3ed1f6494f3dc89f7c' # La magia di Klimmeck
- id: '6ae7ffd05fa3295e56e4dc3c'
  type: religion
  name: Culto del cammino
  description: |-
    Il culto venera il viaggio e la scoperta: vagare senza meta, lasciandosi guidare dal destino, è la vera natura dell'uomo, e molti fedeli di Edite credono anche in Mobus. I discepoli seguono ciò che sentono e non si sentono obbligati a prendere parte a battaglie o grandi eventi, per questo molti li considerano imprevedibili o codardi. Si dice che Edite, insieme a Mobus, abbia donato la magia agli uomini perché seguissero il loro destino senza limiti. È la fede di viandanti, maghi, avventurieri e nomadi, senza figure religiose né luoghi sacri: sono sacre le strade percorse.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc3b' # Edite, il Dio dei viandanti
    - '6ae7ffd05fa3295e56e4dc3d' # Feste del Culto del cammino
    - '6ae7ff6624214746ad54aeee' # Culto del destino
    - '6ae7fc3ed1f6494f3dc89f7c' # La magia di Klimmeck
- id: '6ae7ffd05fa3295e56e4dc3d'
  type: ceremony
  name: Feste del Culto del cammino
  description: |-
    Il Culto del cammino non ha cerimonie né feste. I discepoli devono soltanto pregare ogni volta che si mettono in cammino verso una meta nuova e sconosciuta.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc3b' # Edite, il Dio dei viandanti
    - '6ae7ffd05fa3295e56e4dc3c' # Culto del cammino
- id: '6ae7ffd05fa3295e56e4dc3e'
  type: god
  name: Xellmar, il Dio del terrore
  description: |-
    Xellmar è un potente guerriero seduto su un trono di ossa, con uno spadone al fianco. Gli Orchi lo ritraggono come un orco corpulento accanto a un cinghiale gigante, Demoni e Diavoli come un demone terrificante. Si dice che si mostri nell'una o nell'altra forma secondo chi ha davanti.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc3f' # Culto della guerra
    - '6ae7ffd05fa3295e56e4dc40' # La Festa del massacro
    - '6ae7fc3ed1f6494f3dc89f6a' # La creazione dei piani e delle prime razze
- id: '6ae7ffd05fa3295e56e4dc3f'
  type: religion
  name: Culto della guerra
  description: |-
    Il culto venera la guerra e il duello come forma di potere: solo combattendo si è davvero vivi, e il più forte sta in cima alla catena alimentare e alla società. I fedeli sono temuti ed evitati, perché per loro non esiste pace finché il più forte non comanda su tutti. È il culto degli Orchi e uno dei due principali di Demoni e Diavoli, guidato da un Capo guerriero spesso sfidato, più dittatore che guida spirituale. Lo si venera ovunque vivano Orchi e nel Piano Demoniaco, e i suoi unici luoghi sacri sono l'Arena e il campo di battaglia.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc3e' # Xellmar, il Dio del terrore
    - '6ae7ffd05fa3295e56e4dc40' # La Festa del massacro
    - '6ae7fc3ed1f6494f3dc89f7e' # Il Vuoto e l'Abisso dei Diavoli
- id: '6ae7ffd05fa3295e56e4dc40'
  type: ceremony
  name: La Festa del massacro
  description: |-
    Alla fine di ogni guerra o battaglia i discepoli celebrano la Festa del massacro, razziando e ubriacandosi come forma di preghiera. Con la Cerimonia del superiore la comunità assiste nell'Arena alla sfida per il titolo di Capo guerriero, giudicando un duello in cui quasi nulla è considerato scorretto. All'inizio di ogni battaglia il Capo guerriero rivolge una preghiera a Xellmar.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc3e' # Xellmar, il Dio del terrore
    - '6ae7ffd05fa3295e56e4dc3f' # Culto della guerra
- id: '6ae7ffd05fa3295e56e4dc41'
  type: god
  name: I quattro dei della fortuna
  description: |-
    Oaldir è un giovane svogliato dai capelli scuri, sempre in pose rilassate; Fasmos un uomo bellicoso dai capelli e dalla barba biondi, con un martello che modella il destino a suo favore. Mezaldir è un anziano colto in lunghe vesti viola, chino su tomi che narrano le esperienze degli uomini, mentre Itris è un'elfa bella e maliziosa, in vesti pregiate, dallo sguardo pieno di secondi fini. Si dice che i quattro siano in realtà una sola divinità e rappresentino le diverse facce della sorte. Sono le divinità più attive sul piano terreno dopo Orgeal.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc42' # Culto dei quattro
    - '6ae7ffd05fa3295e56e4dc43' # La Celebrazione delle occasioni
    - '6ae7fc3ed1f6494f3dc89f6e' # La quarta era
- id: '6ae7ffd05fa3295e56e4dc42'
  type: religion
  name: Culto dei quattro
  description: |-
    Fra i culti più recenti, venera la fortuna e l'ignoto: il futuro non è scritto e sono le azioni ad attirare la sorte, ma ogni dio indica una strada diversa. Oaldir chiede di vivere in pace senza intaccare la vita altrui, Fasmos di combattere per ciò che si desidera, Mezaldir di insegnare agli altri il giusto con l'esempio, Itris di piegare persone ed eventi con sotterfugi e persuasione. È il culto principale del Belleholm e dell'Unione delle Fiamme: i Phalan seguono Oaldir, i Kerring Mezaldir e Itris, i Telob Fasmos. Accanto ai Santuari della sorte, comuni a tutti e quattro, ogni villaggio fedele a Fasmos deve avere un Tempio dell'influenza, pena la sciagura; ci sono fedeli anche nelle pianure del sud-est del continente.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc41' # I quattro dei della fortuna
    - '6ae7ffd05fa3295e56e4dc43' # La Celebrazione delle occasioni
    - '6ae7fc3ed1f6494f3dc89f53' # Unione delle Fiamme
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f62' # Pianure dei Valan
- id: '6ae7ffd05fa3295e56e4dc43'
  type: ceremony
  name: La Celebrazione delle occasioni
  description: |-
    Ogni quattro anni, al solstizio d'estate, quasi tutto il Belleholm si riunisce per ammirare insieme le quattro divinità, che bevono, ballano, battibeccano e accettano i doni dei fedeli. Gli dei della fortuna sono gli unici a pretendere offerte nei loro templi in cambio della sorte, concessa solo a chi ne è degno. Amano mescolarsi agli uomini e guidare di persona le comunità, organizzando loro stessi feste e cerimonie.
  image: null
  relatedLore:
    - '6ae7ffd05fa3295e56e4dc41' # I quattro dei della fortuna
    - '6ae7ffd05fa3295e56e4dc42' # Culto dei quattro
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
