- id: '6ae809f29778fd827199f2f9'
  type: city
  name: Danmil Urvyn
  description: |-
    Danmil Urvyn è una città dell'Unione delle Fiamme sulla costa del Belleholm affacciata sull'Oceano Delants. Vive di pesca e dei commerci lungo la Pentabron, ma governa da sola il proprio territorio come ogni popolo dell'Unione. Sotto le sue scogliere nere si apre un sotterraneo che un tempo i pirati usavano come nascondiglio.
