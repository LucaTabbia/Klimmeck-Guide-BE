- id: '6ae809f29778fd827199f301'
  type: city
  name: Thorndenn
  description: |-
    Thorndenn è una città dell'Unione delle Fiamme nascosta fra rovi e foreste alle pendici dei vulcani del Belleholm. Un campo di battaglia sulle rive del lago ricorda l'ultima disputa territoriale con i villaggi vicini. La città cresce guerrieri temprati che l'Unione chiama in caso di guerra.
