  type: city
  name: Gurlaid
  description: |-
    Gurlaid è una città dell'Unione delle Fiamme sulla costa orientale del Belleholm. Un antico campo di battaglia nei dintorni ricorda le piccole guerre fra i popoli dell'isola, finite più con le parole che con il sangue. Fra la foresta e il mare affiorano rovine di un insediamento più antico.
