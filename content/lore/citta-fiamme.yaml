    Yonamnel è un villaggio dell'Unione delle Fiamme fra la foresta tropicale e la costa del Belleholm. Gli abitanti pescano nell'Oceano Delants e raccolgono frutti esotici. Le sue spiagge nere sono un approdo discreto per i pirati degli atolli.
