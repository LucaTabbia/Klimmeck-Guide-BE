  description: |-
    Vudyld è un villaggio dell'Unione delle Fiamme nell'interno del Belleholm. Accanto alle sue capanne si stende un vecchio campo di battaglia delle guerre fra i popoli dell'isola. Oggi vive di agricoltura e di caccia nella boscaglia.
