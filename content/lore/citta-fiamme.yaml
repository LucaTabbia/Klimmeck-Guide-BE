    Usrorn è un villaggio dell'Unione delle Fiamme sulla costa del Belleholm bagnata dall'Oceano Delants. Rovine sepolte a metà dalla sabbia nera circondano le sue case. Si sussurra che vi passi la Rugiada notturna diretta al continente.
