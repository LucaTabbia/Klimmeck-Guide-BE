  type: city
  name: Mapleview
  description: |-
    Mapleview è un villaggio dell'Unione delle Fiamme sulle colline che guardano il lago del Belleholm. Vive di agricoltura e di pesca d'acqua dolce. Un piccolo cimitero accanto al villaggio è temuto per le luci che vi si vedono di notte.
