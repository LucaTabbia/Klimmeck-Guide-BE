  description: |-
    Costenere è un villaggio dell'Unione delle Fiamme che prende il nome dalle spiagge di sabbia vulcanica su cui sorge. Vive di pesca sull'Oceano Delants e di piccoli orti esotici. Le tempeste stagionali lo costringono spesso a ricostruire i moli.
