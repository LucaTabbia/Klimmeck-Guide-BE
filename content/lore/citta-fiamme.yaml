  type: city
  name: Vired Ivem
  description: |-
    Vired Ivem è una città dell'Unione delle Fiamme nell'entroterra del Belleholm. Antica e orgogliosa, segue i riti dei quattro dei della fortuna con più zelo delle città vicine. Le sue strade sono collegate alle altre dalla Pentabron.
