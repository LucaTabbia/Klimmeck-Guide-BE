  description: |-
    Mistglen è un villaggio dell'Unione delle Fiamme in una valle avvolta dai vapori dei vulcani del Belleholm. Un portale demoniaco aperto nella foresta vicina ha fatto fuggire molte famiglie. Chi resta vive di legname e di raccolta di ossidiana.
