  type: city
  name: Sprigfront
  description: |-
    Sprigfront è una città dell'Unione delle Fiamme fra il lago, le foreste e i vulcani del Belleholm. Le sue botteghe trasformano l'ossidiana in armi e ornamenti. Un vecchio cimitero alle pendici del vulcano custodisce le vittime delle eruzioni passate.
