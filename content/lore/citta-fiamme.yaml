- id: '6ae809f29778fd827199f2fc'
  type: city
  name: Oldcairn
  description: |-
    Oldcairn è una città dell'Unione delle Fiamme fra le foreste del Belleholm e l'Oceano Delants. I suoi artigiani lavorano l'ossidiana in lame dal filo tagliente vendute in tutto il continente. Un cumulo di pietre antiche al centro della città le dà il nome e accoglie le preghiere ai quattro dei della fortuna.
