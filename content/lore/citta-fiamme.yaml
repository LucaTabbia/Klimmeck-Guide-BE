  type: city
  name: Lagorovente
  description: |-
    Lagorovente è un villaggio dell'Unione delle Fiamme sulle sponde di un lago scaldato dai vulcani del Belleholm. Le acque calde e fumanti attirano viandanti in cerca di cure. Intorno, la foresta tropicale nasconde vene di ossidiana.
