  type: city
  name: Gidevolm
  description: |-
    Gidevolm è un villaggio dell'Unione delle Fiamme affacciato sul lago del Belleholm. Coltiva frutti esotici sulle rive fertili e commercia via barca con i villaggi vicini. Ogni stagione i suoi abitanti offrono ai quattro dei della fortuna le primizie del raccolto.
