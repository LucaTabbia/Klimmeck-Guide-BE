  description: |-
    Peadale è un villaggio dell'Unione delle Fiamme ai piedi dei vulcani del Belleholm. I suoi campi crescono sulla terra nera e fertile lasciata dalle eruzioni. Un sotterraneo scavato nella roccia lavica attira avventurieri e cercatori di tesori.
