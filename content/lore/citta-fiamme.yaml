  description: |-
    Ultima Terra è un villaggio dell'Unione delle Fiamme sull'estremo lembo del Belleholm, affacciato sull'Oceano Delants. Il suo nome ricorda che oltre non ci sono che il mare e i suoi mostri antichi. Il cimitero sulla scogliera accoglie i marinai che non sono tornati.
