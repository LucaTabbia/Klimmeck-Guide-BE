  name: Fiumelento
  description: |-
    Fiumelento è una città dell'Unione delle Fiamme cresciuta lungo uno dei tanti piccoli fiumi del Belleholm. Le foreste tropicali attorno forniscono frutti esotici e legname per le barche. Un portale demoniaco aperto nella boscaglia tiene in allarme la milizia cittadina.
