  name: Al Nerry
  description: |-
    Al Nerry è un villaggio dell'Unione delle Fiamme fra la foresta e le spiagge nere del Belleholm. I suoi pescatori escono ogni giorno sull'Oceano Delants. Si dice che i pirati degli atolli vi facciano scalo per rifornirsi d'acqua dolce.
