  name: Gellirn
  description: |-
    Gellirn è un villaggio dell'Unione delle Fiamme sulle rive del lago del Belleholm. I suoi pescatori d'acqua dolce riforniscono i mercati dell'isola. La vita vi scorre semplice e serena, lontana dalle dispute fra i popoli maggiori.
