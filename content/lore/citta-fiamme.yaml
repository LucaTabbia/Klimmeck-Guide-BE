- id: '6ae809f29778fd827199f2fe'
  type: city
  name: Pinecrest
  description: |-
    Pinecrest è una città dell'Unione delle Fiamme arroccata su una cresta boscosa del Belleholm. Lontana dalla costa, vive di agricoltura e di legname e si affida alla Pentabron per i commerci. I suoi abitanti si vantano di non aver mai preso parte alle dispute fra i popoli dell'isola.
  image: null
  relatedLore:
