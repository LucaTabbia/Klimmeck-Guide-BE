- id: '6ae809f29778fd827199f2fd'
  type: city
  name: Pianecalde
  description: |-
    Pianecalde è una città dell'Unione delle Fiamme distesa sulle piane tiepide fra il lago e i vulcani del Belleholm. La terra nera e fertile regala colture esotiche abbondanti, ma le inondazioni stagionali la mettono spesso alla prova. Dai pendii vicini scendono ogni giorno i cavatori di ossidiana.
  image: null
