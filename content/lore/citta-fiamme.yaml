  description: |-
    Cu Nuimyn è un villaggio dell'Unione delle Fiamme sulla costa boscosa del Belleholm. Gli abitanti raccolgono frutti tropicali e pescano nell'Oceano Delants. Le capanne su palafitte resistono alle inondazioni che colpiscono l'isola in certi periodi dell'anno.
