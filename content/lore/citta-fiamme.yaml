- id: '6ae809f29778fd827199f2ff'
  type: city
  name: Rosedenn
  description: |-
    Rosedenn è una città dell'Unione delle Fiamme sulle rive del lago del Belleholm. Pescatori e coltivatori di frutti esotici ne fanno un centro sereno, anche se le tasse quasi inesistenti dell'Unione lasciano povere le casse cittadine. Un sotterraneo sotto le colline vicine richiama avventurieri da tutta l'isola.
  image: null
