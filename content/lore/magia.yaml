- id: '6ae7fc3ed1f6494f3dc89f7e'
  type: knowledge
  name: Il Vuoto e l'Abisso dei Diavoli
  description: |-
    Il Vuoto è il potere del caos, innato nei Diavoli: manifesta i desideri più oscuri senza parole né gesti, e i simboli servono solo a racchiuderlo in oggetti, persone o luoghi come una maledizione. Richiede molto caos e un poco d'ordine, per questo solo i Diavoli lo dominano davvero, mentre gli Umani che ci provano finiscono maledetti o uccisi; il Vampirismo è una di queste maledizioni, e i Lich riescono spesso a usarlo. Con il Vuoto si lanciano maledizioni, si stringono patti in cambio di anime e si creano bolle di caos distruttive. L'Abisso, padroneggiato da pochi Diavoli potenti, è la sua forma più libera, nata studiando per secoli la magia del Piano Materiale.
