- id: '6ae7fc3ed1f6494f3dc89f7d'
  type: knowledge
  name: Lo sciamanesimo
  description: |-
    Lo sciamanesimo è la prima forma di magia del continente, nata prima della fonte di Edite. Si basa su preghiere e riti rivolti agli dei, che concedono un potere limitato sugli elementi naturali. Gli sciamani possono evocare elementali o piegare gli elementi a proprio favore. È ancora vivo soprattutto nelle tribù Draconiche e Aarakocra.
