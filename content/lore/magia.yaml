# La magia di Klimmeck (D-23)

- id: '6ae7fc3ed1f6494f3dc89f7c'
  type: knowledge
  name: La magia di Klimmeck
  description: |-
    La magia si studia solo all'Accademia di Valantar, aperta agli avventurieri che hanno compiuto imprese nei regni: lì si accede alla fonte e si sbloccano le proprie capacità. È la manifestazione dell'immaginazione e dei desideri di chi la usa, che deve tradurli in parole, gesti o simboli propri, perché non esiste una lingua magica universale. I simboli, più regolari, servono a controllarla e potenziarla, e per questo si incidono su tomi e aste. Negli Umani la magia allunga la vita di decenni o secoli, ma non tutti la usano per il bene.
