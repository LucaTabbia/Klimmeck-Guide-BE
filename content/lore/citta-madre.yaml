  type: city
  name: Kom Dorul
  description: |-
    Kom Dorul è una città sotterranea del Regno della Madre all'estremo nord del Lamstone. Funicolari e gru alimentate dalle rune collegano le miniere alla superficie gelata. Fra le gallerie dimenticate si aprono sotterranei e rovine che nemmeno i nani osano esplorare.
