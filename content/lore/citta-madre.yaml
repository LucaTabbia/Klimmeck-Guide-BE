  type: city
  name: Gor Buldar
  description: |-
    Gor Buldar è una città sotterranea del Regno della Madre scavata nelle profondità del Lamstone. Nani e gnomi vi estraggono pietre preziose e metalli, alla luce dell'energia delle rune magiche. In superficie restano le rovine della prima città, abbandonata secoli fa per le tempeste di neve.
