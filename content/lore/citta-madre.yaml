  name: Veg Faldir
  description: |-
    Veg Faldir è un villaggio del Regno della Madre all'estremo nord del Lamstone, battuto dalle tempeste. Le sue miniere scendono in profondità fino a gallerie dimenticate. Si dice che i giganti delle montagne passino talvolta sopra le sue case, facendo tremare la roccia.
