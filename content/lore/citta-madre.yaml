- id: '6ae809f20080b01f87b69fa2'
  type: city
  name: Nul Lodir
  description: |-
    Nul Lodir è una città del Regno della Madre arroccata sulle vette del Lamstone, ai margini del Lontano Nord. Vi vivono soprattutto draconidi, che abitano in superficie e praticano la magia sciamanica dei monti. Le carovane di birra e grano da Drustea vi arrivano solo nella bella stagione.
