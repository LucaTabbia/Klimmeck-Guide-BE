- id: '6ae809f20080b01f87b69fa3'
  type: city
  name: Biroldur
  description: |-
    Biroldur è un villaggio del Regno della Madre fra le vette più fredde del Lamstone. Le sue case sono scavate nella roccia per resistere alle tempeste di neve che durano anche un mese. I suoi minatori lavorano vene di pietre preziose per i mercanti della capitale.
