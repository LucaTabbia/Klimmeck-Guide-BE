  type: city
  name: Kom Dural
  description: |-
    Kom Dural è un villaggio sotterraneo del Regno della Madre nelle gallerie del Lamstone. I suoi incisori di rune lavorano per le officine della capitale. Un ossario scavato nella roccia custodisce le spoglie degli antenati.
