- id: '6ae809f20080b01f87b69fa4'
  type: city
  name: Himboram
  description: |-
    Himboram è un villaggio del Regno della Madre sulle pendici del Lamstone. Un sentiero montano lo collega alle Vene della madre e da lì a Morrulir. Accanto al villaggio si trovano le rovine di un antico avamposto nanico.
