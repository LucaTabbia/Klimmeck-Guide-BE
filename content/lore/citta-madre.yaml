  name: Kim Todur
  description: |-
    Kim Todur è una città del Regno della Madre sui versanti settentrionali del Lamstone, dove le montagne scendono verso il Lontano Nord. Le sue gallerie sono collegate alla capitale dalle Vene della madre. Un cimitero scavato nella roccia accoglie i minatori caduti.
