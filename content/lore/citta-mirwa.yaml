  name: Acquasacra
  description: |-
    Acquasacra è una città della Teocrazia di Mirwa sulle rive del lago Nanfail, le cui fonti sono ritenute benedette dalla dea. I pellegrini diretti a Mirwen vi si fermano per bagnarsi nelle acque sacre. Sotto la città si aprono gallerie del Temistos e un antico cimitero custodito dai sacerdoti.
