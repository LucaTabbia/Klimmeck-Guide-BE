  description: |-
    Candelaria è una città della Teocrazia di Mirwa arroccata fra i monti del Temistos, nota per le candele votive che illuminano le sue strade durante le feste della dea. Vive delle cave vicine e del commercio di cera e tessuti. Il Cammino lucente la collega al resto del regno, quando le frane lo permettono.
