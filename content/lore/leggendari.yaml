    - '6ae7fc3ed1f6494f3dc89f7e' # Il Vuoto e l'Abisso dei Diavoli
- id: '6ae80b5b2e7351b494ecc861'
  type: enemy
  name: Drago d'ombra adulto e anziano
  description: |-
    Creature subdole e astute legate al Piano delle Ombre, dalle scaglie traslucide e dai corpi scuri: da lontano sembrano solo una massa d'ombre foriera di funesti presagi. Solo un drago puro nato nella Coltre Oscura, o rimasto lì per molti anni, diventa un drago d'ombra; un dracolich non può, perché da non morto ha perso la natura draconica. Vivono unicamente nelle profondità della terra. Il loro soffio causa necrosi, acceca e indebolisce, e chi ne muore si rialza come un'ombra al loro servizio; nell'oscurità diventano immuni a ogni magia che non sia di luce.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
    - '6ae8018831ec3185a9e09930' # Drago d'ombra giovane
    - '6ae7fc3ed1f6494f3dc89f6a' # La creazione dei piani e delle prime razze
- id: '6ae80b5b2e7351b494ecc862'
  type: enemy
  name: Draghi adulti e antichi
  description: |-
    Potenti creature magiche fra le razze più antiche del mondo: i cromatici e i metallici sono i più comuni, e il colore ne determina la personalità e il tipo di soffio. Da adulti e poi da antichi diventano signori di territori interi, che pochi osano attraversare. Pochi draghi rossi vivono nei vulcani del Belleholm e i draghi d'argento nel Lamstone e nelle colline vicine; si dice che dei draghi blu abitino il deserto, ma se ne conosce uno solo. Attaccano con artigli, fauci, coda, ali e con il soffio della loro specie, e terrorizzano le altre creature.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
