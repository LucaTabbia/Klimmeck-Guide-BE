- id: '6ae80b5b2e7351b494ecc867'
  type: enemy
  name: Demilich
  description: |-
    Non lich minori, ma lich che si sono evoluti oltre il bisogno del loro corpo non morto, vicini alla fine del loro viaggio arcano e a una comprensione della magia e della realtà che nessun mortale può concepire. Quattro di loro vivono a Necrorian e sono gli alti generali del Re lich; pochi altri si nascondono nel resto del continente. Il loro urlo può uccidere sul colpo: risucchiano la vita, accecano, impediscono di guarire e di usare la magia e fanno tremare il terreno della loro tana. Sono immuni agli attacchi non magici e resistono alle armi magiche.
  image: null
