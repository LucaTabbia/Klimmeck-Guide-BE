# Leggendari (D-07, D-09): una lore enemy per scheda leggendaria del documento; i nemici legendary sono i boss della Phase 13

- id: '6ae80b5b2e7351b494ecc85c'
  type: enemy
  name: Tarrasque
  description: |-
    Immensa bestia rettiloide tutta zanne, corna e artigli, con una coda uncinata che frusta l'aria: somiglia a un dinosauro, ma cammina anche sulle nocche come un gorilla. Passa gran parte del tempo in un letargo profondo, in una caverna sconosciuta nel sottosuolo, e quando si risveglia interi regni muoiono ovunque compaia. Non può essere ucciso, solo fermato: si rigenera anche se disintegrato, è immune a ogni magia debilitante e scaglia le spine del suo corpo a metri di distanza. Come ogni mostro leggendario non si affronta da soli: le cronache contano gli eroi e i maghi di supporto che servono, e raramente basta senza l'aiuto degli dei.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f6a' # La creazione dei piani e delle prime razze
- id: '6ae80b5b2e7351b494ecc85d'
  type: enemy
  name: Kraken
  description: |-
    Creatura della taglia di una balena, lunga quasi trenta metri, con una testa da rettile, fauci zannute e tentacoli lungo il corpo serpentiforme, coperto di sigilli inquietanti. È la più grande paura dei marinai del Ladows: colpisce dalle profondità senza farsi vedere, comanda i venti e le tempeste e possiede l'intelletto crudele dei peggiori criminali. Afferra intere navi con i tentacoli, inghiotte e morde, spruzza un inchiostro che intossica e ha una bile acida che scioglie ciò che tocca. C'è chi lo crede una punizione divina e chi il vero signore degli abissi.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f66' # Oceano Ladows
- id: '6ae80b5b2e7351b494ecc85e'
  type: enemy
  name: Artropal
  description: |-
    Feto nero, malformato e incompleto, palesemente non morto: un corpo molle e rigonfio sormontato da un cranio calvo e troppo grande, occhi vitrei, braccia esili con unghie affilate e gambe atrofizzate che pendono nel vuoto. Non cammina mai, fluttua, e proclama senza sosta oscenità prive di senso. Dorme in antichissime catacombe dimenticate, e nessuno sa dove se ne troverà uno; chi ne profana la tomba scatena ondate di furia sempre più devastanti. Risucchia la vitalità di chiunque si avvicini, è immune alla magia debilitante e comanda ogni non morto: si dice che perfino il Re lich ne sia terrorizzato.
  image: null
  relatedLore:
    - '6ae7ff6624214746ad54aee8' # Culto della morte
    - '6ae7fc3ed1f6494f3dc89f7e' # Il Vuoto e l'Abisso dei Diavoli
- id: '6ae80b5b2e7351b494ecc85f'
  type: enemy
  name: Goristro
  description: |-
    Demoni larghi e robusti, alti più di sei metri anche fra i più piccoli, dalla struttura simile a quella di un orso, con braccia grosse come tronchi su cui si lanciano in avanti come gorilla giganti. Le spalle enormi reggono una testa massiccia da bisonte, con denti da carnivoro e corna che si curvano verso l'alto. Si trovano solo nei pressi dei portali demoniaci. Sono stupidi, ma dotati di una forza mostruosa, e combattono soltanto con il proprio corpo.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f7e' # Il Vuoto e l'Abisso dei Diavoli
    - '6ae8001b906eac0adda59a4b' # Jur'gath, il signore dei demoni
    - '6ae7ffd05fa3295e56e4dc3f' # Culto della guerra
- id: '6ae80b5b2e7351b494ecc860'
  type: enemy
  name: Dracolich
  description: |-
    Draghi che hanno legato volontariamente la propria anima a un Filatterio, il contenitore della forza di un lich, per sfuggire alla morte; solo un drago puro adulto o antico può diventarlo. Lo spirito può possedere qualsiasi corpo rettiliano morto, di solito il proprio, e conserva l'aura di paura, gli incantesimi e il soffio che aveva in vita, insieme alla terribile potenza dei non morti. Si trovano unicamente nel Glounet. Attaccano con artigli, fauci, coda, ali e con il soffio della loro specie, e terrorizzano chi li affronta.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5f' # Glounet
    - '6ae7fc3ed1f6494f3dc89f57' # Necrorian e il Glounet
