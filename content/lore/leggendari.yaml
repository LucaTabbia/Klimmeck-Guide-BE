    - '6ae8001b906eac0adda59a44' # Amaerith, il fuoco rosso
- id: '6ae80b5b2e7351b494ecc863'
  type: enemy
  name: Urvinass, il dracolich rosso
  description: |-
    Il più temuto dei dracolich: un drago rosso antico che ha legato la sua anima a un Filatterio ed è diventato uno dei signori supremi della morte e il braccio destro del Re lich. Conserva l'aura di terrore, gli incantesimi e la potenza che aveva in vita, accresciuti dalla non morte. Risiede nel Glounet, accanto al suo padrone. Combatte con artigli, fauci, coda, ali e con un soffio di fuoco nero, terrorizza chi lo affronta e si rigenera con il passare del tempo.
  image: null
  relatedLore:
