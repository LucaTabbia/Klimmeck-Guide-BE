- id: '6ae80b5b2e7351b494ecc864'
  type: enemy
  name: Lung Wang
  description: |-
    Draghi del mare dal corpo di tartaruga, con un guscio di spesse scaglie verdi macchiate d'argento, una testa da lucertola con lunghi baffi dorati e piccole corna nere e potenti pinne anteriori. A differenza degli altri draghi lung sono quasi erbivori, ma integrano la dieta con pesce e minerali e sono noti per aver divorato intere navi. Si trovano in entrambi gli oceani. Non volano e non colpiscono con coda o ali, ma ribaltano le navi per renderne l'equipaggio vulnerabile, poi attaccano con artigli, zanne e un getto di vapore tanto più potente quanto più il drago è antico.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f66' # Oceano Ladows
    - '6ae7fc3ed1f6494f3dc89f67' # Oceano Delants
- id: '6ae80b5b2e7351b494ecc865'
  type: enemy
  name: Golem di ferro
  description: |-
    Il più potente dei golem: una creatura costruita, non nata, dalla forma di un umano incompiuto, con una runa che porta le iscrizioni del suo creatore. Si trova in antiche rovine magiche e spesso accompagna i maghi che l'hanno creato. È immune agli attacchi non magici che non siano di adamantio e a ogni condizione fisica o mentale. Colpisce con la forza e con le armi, i suoi colpi sono magici, rallenta gli avversari e sputa un gas velenoso.
  image: null
  relatedLore:
    - '6ae802f65f3e1244a34ae37e' # Golem
    - '6ae7fc3ed1f6494f3dc89f74' # Rune magiche
    - '6ae7fc3ed1f6494f3dc89f7c' # La magia di Klimmeck
- id: '6ae80b5b2e7351b494ecc866'
  type: enemy
  name: Lich
  description: |-
    Apice delle arti necromantiche: incantatori che hanno rinunciato alla vita imprigionando la propria forza vitale in un Filatterio, e che finché questo resta intatto possono proseguire le loro ricerche senza temere il tempo. Vivono nelle cripte e nei cimiteri antichi e abbandonati, dove governano ghoul e wraith, e molti di loro abitano Necrorian, nel Glounet, sotto il comando del Re lich. Sono maghi formidabili e tornano in vita in pochi giorni se il Filatterio non viene distrutto. Il loro tocco paralizza, resistono a chierici e paladini, spaventano chi li guarda e scagliano palle di fuoco, coni di freddo e cerchi di morte.
  image: null
  relatedLore:
