- id: '6ae80b5b2e7351b494ecc868'
  type: enemy
  name: Orgeal, il Re lich
  description: |-
    Il primo non morto, un tempo il mago più potente degli Alti Savi, oggi divinità venerata da necromanti e non morti e signore della Città Non-Morta. Siede sul suo trono a Necrorian e non se ne allontana mai. È ritenuto immortale: ha legato l'anima a numerosi Filatteri, di cui nessuno conosce il numero né il luogo. Il suo tocco e il suo sguardo paralizzano, risucchia la vita, acceca, impedisce ai nemici di guarire e di usare la magia e li maledice attingendo al Vuoto; è immune agli attacchi non magici e padroneggia la magia necrotica più oscura.
  image: null
