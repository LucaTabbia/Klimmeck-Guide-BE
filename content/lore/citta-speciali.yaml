- id: '6ae809f3e428a66e9ce2c227'
  type: city
  name: Rae Thelar
  description: |-
    Rae Thelar è un villaggio di elfi nella foresta di Minnely, nel Regno di Drustea. Accanto al villaggio sorgono le rovine di un'epoca in cui gli elfi abitavano tutta la foresta. Un antico cimitero custodisce gli elfi morti per cause esterne, i soli che il tempo non risparmia.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f50' # Regno di Drustea
