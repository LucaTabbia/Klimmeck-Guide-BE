  type: city
  name: Croce Marina
  description: |-
    Croce Marina è un villaggio tropicale dell'Unione delle Fiamme sulle spiagge del Belleholm. Una grande croce di legno sulla riva guida a casa i pescatori dell'Oceano Delants. Le foreste alle sue spalle forniscono frutti esotici e legname.
