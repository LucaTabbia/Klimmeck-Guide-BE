- id: '6ae809f3e428a66e9ce2c226'
  type: city
  name: Naellond
  description: |-
    Naellond è un villaggio del Minnely, la foresta lieve del Regno di Drustea. Gli elfi che lo abitano vivono di raccolta e di caccia e commerciano legno pregiato. Il Sentiero dei Savi lo collega agli altri villaggi della foresta.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f50' # Regno di Drustea
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
