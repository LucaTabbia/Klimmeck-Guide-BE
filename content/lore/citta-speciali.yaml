- id: '6ae809f3e428a66e9ce2c229'
  type: city
  name: Dhomfuhn
  description: |-
    Dhomfuhn è un villaggio montano del Regno della Madre sulle pendici settentrionali del Lamstone. Draconidi e nani vi convivono fra la superficie e le gallerie. Le tempeste di neve isolano il villaggio per settimane ogni inverno.
  image: null
  relatedLore:
