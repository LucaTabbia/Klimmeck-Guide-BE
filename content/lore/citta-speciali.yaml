  type: city
  name: Lunaris
  description: |-
    Lunaris è un villaggio del Regno di Drustea sulle colline del Lontano Nord, dove le notti d'inverno durano a lungo. Il suo nome viene dalle aurore che illuminano le rovine vicine. Un sotterraneo sotto le colline attira avventurieri temerari.
  image: null
  relatedLore:
