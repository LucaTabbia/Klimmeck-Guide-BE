- id: '6ae809f3e428a66e9ce2c231'
  type: city
  name: Llyne
  description: |-
    Llyne è un villaggio del Regno di Drustea fra i boschi e le colline del Lontano Nord. I suoi cacciatori commerciano pellicce con le città sul Chande. L'inverno lungo e aspro rende la comunità unita e ospitale.
  image: null
  relatedLore:
