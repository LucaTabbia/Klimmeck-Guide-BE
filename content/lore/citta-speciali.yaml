- id: '6ae809f3e428a66e9ce2c222'
  type: city
  name: Al Anore
  description: |-
    Al Anore è un villaggio di elfi nelle radure centrali della foresta di Minnely, nel Regno di Drustea. Come le altre comunità del Minnely, è nascosto agli stranieri da una coltre magica. Si raggiunge soltanto dal Sentiero dei Savi.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f50' # Regno di Drustea
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
  city: '69096161141b9dd4d0442973' # Al Anore
- id: '6ae809f3e428a66e9ce2c223'
  type: city
  name: Capofoce
  description: |-
    Capofoce è un villaggio del Regno di Drustea dove un fiume esce dal bosco verso le pianure. I suoi abitanti vivono di pesca, caccia e legname. Le sue segherie forniscono botti e travi alle birrerie della zona.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f50' # Regno di Drustea
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
  city: '690961449f34beae3f549c26' # Capofoce
- id: '6ae809f3e428a66e9ce2c224'
  type: city
  name: Jok
  description: |-
    Jok è un villaggio boscoso del Regno di Drustea nelle pianure del nord. Un portale demoniaco aperto nel folto ha reso il bosco pericoloso e ha attirato cacciatori di mostri. Chi vive qui commercia pellicce e legname con le città sul Chande.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f50' # Regno di Drustea
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
