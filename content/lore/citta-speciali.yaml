  type: city
  name: Nortorn
  description: |-
    Nortorn è un villaggio del Regno di Drustea sulla costa settentrionale affacciata sull'Oceano Delants. Le correnti impervie del nord rendono la pesca pericolosa. Un portale demoniaco sulle colline vicine tiene il villaggio in costante allerta.
