  type: city
  name: Duril
  description: |-
    Duril è un villaggio tropicale dell'Unione delle Fiamme nella foresta del Belleholm. Vive di raccolta e di piccole coltivazioni lungo un fiume. Si sussurra che nella boscaglia cresca il Vespro Argenteo, la pianta da cui si ricava la Rugiada notturna.
  image: null
