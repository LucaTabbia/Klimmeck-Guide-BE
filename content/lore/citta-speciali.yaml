- id: '6ae809f3e428a66e9ce2c239'
  type: city
  name: Gellen
  description: |-
    Gellen è un villaggio tropicale dell'Unione delle Fiamme su un atollo vicino al Belleholm. Le sue spiagge nere sono battute dalle tempeste stagionali. Il piccolo cimitero è dedicato ai marinai scomparsi nell'Oceano Delants.
  image: null
  relatedLore:
