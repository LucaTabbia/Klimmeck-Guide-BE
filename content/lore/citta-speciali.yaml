  type: city
  name: Norfolk
  description: |-
    Norfolk è un villaggio del Regno di Drustea nel Lontano Nord, fra colline e boschi di conifere. Vive di un'agricoltura povera, di caccia e di legname. Le sue birrerie producono una birra scura apprezzata dai viandanti.
  image: null
  relatedLore:
