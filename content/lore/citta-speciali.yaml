  type: city
  name: Dalde
  description: |-
    Dalde è un villaggio tropicale dell'Unione delle Fiamme nascosto nella foresta del Belleholm. Rovine invase dalla vegetazione e un sotterraneo vicino alla costa fanno gola agli avventurieri. Si dice che sia un covo di pirati.
