  type: city
  name: Bosa
  description: |-
    Bosa è un villaggio del Regno della Madre nelle distese ghiacciate del Lontano Nord. Pochi cacciatori e minatori vi resistono al freddo più aspro del continente. Le carovane che lo raggiungono portano provviste in cambio di pellicce e metalli.
  image: null
  relatedLore:
