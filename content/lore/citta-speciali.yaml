# Lore delle città dei tipi speciali (D-23): villaggi aarakocra, del deserto, delle foreste, dei monti, del nord e tropicali; campo solo-file city con l'id dello snapshot

- id: '6ae809f3e428a66e9ce2c217'
  type: city
  name: Balkuldir
  description: |-
    Balkuldir è un villaggio di aarakocra sulle vette del Lamstone, nel territorio del Regno della Madre. I suoi nidi alti e isolati sono costruiti sulle pareti a strapiombo. Gli uomini uccello difendono la loro terra con diffidenza e scacciano gli stranieri che si spingono troppo vicino.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f54' # Regno della Madre
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
  city: '690961bf3ed284bbb23a15b6' # Balkuldir
- id: '6ae809f3e428a66e9ce2c218'
  type: city
  name: Murnborim
  description: |-
    Murnborim è un villaggio di aarakocra fra le cime settentrionali del Lamstone, ai confini del Lontano Nord, nel Regno della Madre. La tribù vi torna ogni anno dopo aver seguito le prede lungo i passi montani. Fra i nidi sorgono le rovine di un antico santuario dedicato a Lizdum.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f54' # Regno della Madre
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f63' # Lontano Nord
  city: '690961bfe74c2f6dfc837d8f' # Murnborim
- id: '6ae809f3e428a66e9ce2c219'
  type: city
  name: Thengran
  description: |-
    Thengran è un villaggio di aarakocra sulle vette gelate del Lamstone, verso il Lontano Nord. I suoi abitanti, figli di Lizdum secondo la tradizione, sono cacciatori abili e diffidenti verso gli stranieri. Si dice che alcuni di loro assaltino le carovane che salgono il Passo dei giganti.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f54' # Regno della Madre
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f63' # Lontano Nord
  city: '690961bf31795cde80768bc7' # Thengran
- id: '6ae809f3e428a66e9ce2c21a'
  type: city
  name: Adehr
  description: |-
    Adehr è un villaggio della Repubblica dei Valan sorto al pelo dell'acqua di un'oasi del Mar Sabbioso. I suoi abitanti vivono dell'estrazione del Sundenim affiorato dalle correnti delle dune. Fra la sabbia emergono le rovine di una città sommersa dal deserto.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f51' # Repubblica dei Valan
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
  city: '690962040ba4d7934a8a59a0' # Adehr
- id: '6ae809f3e428a66e9ce2c21b'
  type: city
  name: Arbisrah
  description: |-
    Arbisrah è un villaggio dei Valan su un'oasi del Mar Sabbioso, dove il fondale è stabile e solido. Le sue chiatte navigano le dune trainate dalle bestie che nuotano nella sabbia. Un sotterraneo sotto le rocce dell'oasi attira cercatori di Sundenim e di tesori.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f51' # Repubblica dei Valan
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
  city: '6909620412ed8a8e5c412c58' # Arbisrah
- id: '6ae809f3e428a66e9ce2c21c'
  type: city
  name: Hiorgen
  description: |-
    Hiorgen è un villaggio della Repubblica dei Valan in un'ampia oasi del Mar Sabbioso. Le sue squadre di estrattori raccolgono le rocce di Sundenim portate in superficie dalle correnti. Rovine e sotterranei sepolti nelle dune vicine raccontano un passato più antico della repubblica.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f51' # Repubblica dei Valan
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
  city: '6909620438e7bde89092474e' # Hiorgen
- id: '6ae809f3e428a66e9ce2c21d'
  type: city
  name: Pinatlu
  description: |-
    Pinatlu è un villaggio dei Valan sul margine del Mar Sabbioso, dove il deserto lascia il posto alle pianure. È l'ultimo approdo delle carovane di Sundenim prima delle fucine della repubblica. Nei dintorni si trovano rovine e un sotterraneo che pochi hanno esplorato.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f51' # Repubblica dei Valan
    - '6ae7fc3ed1f6494f3dc89f62' # Pianure dei Valan
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
  city: '6909620496b6d2faac014169' # Pinatlu
- id: '6ae809f3e428a66e9ce2c21e'
  type: city
  name: Shadmus
  description: |-
    Shadmus è un piccolo villaggio della Repubblica dei Valan su un'oasi isolata del Mar Sabbioso. I suoi abitanti conoscono le correnti delle dune meglio di chiunque altro. Vivono del Sundenim e dell'acqua che vendono alle carovane di passaggio.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f51' # Repubblica dei Valan
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
  city: '690962041becd7b75e22f8ef' # Shadmus
- id: '6ae809f3e428a66e9ce2c21f'
  type: city
  name: Shibirm
  description: |-
    Shibirm è un villaggio dei Valan raccolto attorno a un'oasi del Mar Sabbioso. Le palme e la sorgente lo rendono una sosta preziosa per chi attraversa il deserto. Rovine erose dal vento circondano le sue case di pietra chiara.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f51' # Repubblica dei Valan
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
  city: '69096204f349d6ebefd4f67e' # Shibirm
- id: '6ae809f3e428a66e9ce2c220'
  type: city
  name: Unaicca
  description: |-
    Unaicca è un villaggio della Repubblica dei Valan sulle rive di un'oasi del Mar Sabbioso. I suoi barcaioli guidano le chiatte fra le dune navigabili. Accanto all'oasi affiorano rovine che le correnti di sabbia scoprono e ricoprono a ogni stagione.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f51' # Repubblica dei Valan
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
  city: '6909620476ef1b589f98d6a0' # Unaicca
- id: '6ae809f3e428a66e9ce2c221'
  type: city
  name: Agosbert
  description: |-
    Agosbert è un villaggio del Regno di Drustea nei boschi delle pianure del nord. Vive di raccolta, caccia e commercio di legname. Un piccolo cimitero fra gli alberi è al centro delle storie che gli abitanti raccontano ai viandanti.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f50' # Regno di Drustea
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
