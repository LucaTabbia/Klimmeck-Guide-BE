  type: city
  name: Vegduhr
  description: |-
    Vegduhr è un villaggio montano del Regno della Madre lungo i sentieri che salgono verso il Passo dei giganti. I suoi abitanti scavano gallerie collegate alle Vene della madre. Un cimitero di pietra domina la valle sotto il villaggio.
  image: null
  relatedLore:
