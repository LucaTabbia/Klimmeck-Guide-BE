  type: city
  name: Kliever
  description: |-
    Kliever è un villaggio del Lontano Nord ai confini del Regno della Madre. Le sue case basse e coperte di neve sono riparate dal vento dei ghiacci. Vive di caccia e dei commerci con i villaggi del Lamstone.
  image: null
  relatedLore:
