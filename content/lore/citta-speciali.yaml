- id: '6ae809f3e428a66e9ce2c22c'
  type: city
  name: Andogan
  description: |-
    Andogan è un villaggio del Lontano Nord sulla costa occidentale, nel Regno della Madre. Il suo piccolo molo è uno dei pochi da cui il regno commercia via oceano. Gli abitanti vivono di pesca nel gelido Oceano Ladows e di caccia sulle colline.
