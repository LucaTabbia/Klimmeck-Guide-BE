  type: city
  name: Gurdarul
  description: |-
    Gurdarul è un villaggio di draconidi sulle vette del Lamstone, nel Regno della Madre. La comunità cresce ogni figlio come figlio di tutti e pratica la magia sciamanica dei monti. Gli stranieri vi sono accolti con diffidenza.
  image: null
  relatedLore:
