  type: city
  name: Erast
  description: |-
    Erast è un villaggio del Regno di Drustea fra le colline gelate del Lontano Nord. I suoi abitanti allevano bestiame resistente al freddo e coltivano orzo nelle brevi estati. Le sue locande servono birra calda ai viandanti diretti a nord.
  image: null
