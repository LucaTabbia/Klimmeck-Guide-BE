  type: city
  name: Inverness
  description: |-
    Inverness è un villaggio del Regno di Drustea sulle colline boscose del Lontano Nord. Rovine e un antico cimitero circondano le sue case di pietra. Gli abitanti vivono di legname e pellicce e raccontano storie di fantasmi nelle lunghe notti.
  image: null
