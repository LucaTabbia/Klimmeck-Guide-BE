- id: '6ae809f3e428a66e9ce2c225'
  type: city
  name: Lehadorei
  description: |-
    Lehadorei è un villaggio di elfi nel cuore della foresta di Minnely, nel Regno di Drustea. Gli abitanti vivono in comunione con la natura e custodiscono antiche usanze. Fra le radici di un albero millenario si apre un sotterraneo che gli elfi sorvegliano da secoli.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f50' # Regno di Drustea
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
