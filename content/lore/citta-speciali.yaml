  type: city
  name: Dawnborough
  description: |-
    Dawnborough è un villaggio tropicale dell'Unione delle Fiamme rivolto a est, dove il sole sorge sull'Oceano Delants. I suoi abitanti vivono di pesca e di colture esotiche. Un cimitero fra le palme accoglie le vittime delle tempeste.
