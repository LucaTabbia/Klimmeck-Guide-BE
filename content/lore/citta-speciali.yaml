- id: '6ae809f3e428a66e9ce2c228'
  type: city
  name: Thanlenor
  description: |-
    Thanlenor è un villaggio di elfi fra gli alberi del Minnely, nel Regno di Drustea. I suoi abitanti, figli di Enayr secondo la tradizione, vivono in armonia con la foresta. Un piccolo cimitero fra le radici è curato con grande rispetto.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f50' # Regno di Drustea
