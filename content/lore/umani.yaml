    - '6ae7fc3ed1f6494f3dc89f7c' # La magia di Klimmeck
- id: '6ae80bf6947d6a423521c70a'
  type: enemy
  name: Guerrieri e mercenari
  description: |-
    Combattenti delle tribù del nord, berserker, veterani di guerre dimenticate, cavalieri caduti in disgrazia e gladiatori delle arene: guerrieri che vendono la spada a chi paga o che hanno scelto la violenza come mestiere. Si incontrano sui campi di battaglia, lungo le strade delle pianure e nelle città dove le arene attirano folle e scommesse. Le tribù dei ghiacci e delle isole del nord combattono in branco, i berserker si gettano nella mischia senza curarsi delle ferite e i veterani sanno sfruttare ogni errore dell'avversario. Molti venerano Xellmar e il suo culto della guerra.
  image: null
  relatedLore:
