# Umani e umanoidi ostili (D-07): una lore enemy per gruppo dell'intake; le bande non hanno una voce (una banda = N × Bandito nella Phase 13)

- id: '6ae80bf6947d6a423521c708'
  type: enemy
  name: Criminali e briganti
  description: |-
    Banditi, picchiatori e assassini infestano le strade poco sorvegliate delle grandi pianure e i vicoli delle città di ogni regno. Le bande di briganti tendono imboscate alle carovane sulle vie commerciali fra Drustea e i Valan, mentre nei centri abitati i picchiatori riscuotono per conto dei loro capi e gli assassini vendono la morte al miglior offerente. I più pericolosi finiscono nella Città Prigione di Ferrion, se qualcuno riesce a catturarli. Combattono in gruppo, con lame corte, mazze e balestre, e i più abili colpiscono di sorpresa con armi avvelenate.
  image: null
