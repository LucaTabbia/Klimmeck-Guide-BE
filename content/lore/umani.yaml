- id: '6ae80bf6947d6a423521c70c'
  type: enemy
  name: Giganti delle colline
  description: |-
    Esseri quasi leggendari dalle dimensioni enormi e dall'aspetto simile a quello umano, che vivono in pochi villaggi o piccoli gruppi fra i monti Lamstone e scendono sulle colline vicine. Sono schivi, vivono per secoli e dormono tanto a lungo che le rocce finiscono quasi per inglobarli; il loro vagare causa spesso frane. Si dice che Naleala li abbia creati prima dei nani per proteggere le montagne, causando la separazione del Lamstone dal Temistos, e che parlino ad alta voce una lingua antica. Hanno una forza mostruosa: colpiscono con grandi randelli e scagliano massi contro chi invade le loro valli.
  image: null
