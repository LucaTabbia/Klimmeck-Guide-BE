- id: '6ae80bf6947d6a423521c709'
  type: enemy
  name: Cultisti e incantatori oscuri
  description: |-
    Seguaci di culti proibiti, sacerdoti corrotti e maghi rinnegati che cercano nel Vuoto, nella morte o nel caos un potere che le scuole e i templi negano loro. Si radunano in segreto nelle cantine delle città, nelle rovine e nei cimiteri, e alcuni guardano a Necrorian e al suo Re lich come a una promessa di immortalità. I cultisti più umili obbediscono ciecamente, i fanatici li guidano nei riti, e gli arcimaghi caduti nell'oscurità sono fra gli incantatori più temibili del continente. Combattono con pugnali e scimitarre, ma la loro vera arma sono le maledizioni e le magie necrotiche.
  image: null
  relatedLore:
