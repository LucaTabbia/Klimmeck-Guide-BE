- id: '6ae80bf6947d6a423521c70b'
  type: enemy
  name: Orchi e tribù goblinoidi
  description: |-
    Razza semi-umana violenta e aggressiva, figlia di Xellmar, che il dio creò a sua somiglianza per conquistare le razze delle altre divinità: hanno zanne che escono dalla bocca, pelle verdastra o grigiastra e a volte superano i due metri e quaranta. Vivono soprattutto negli arcipelaghi del nord e, ben nascosti dalle montagne, sulle coste settentrionali del continente, chiusi in zone impervie per non mescolarsi con gli altri popoli. Spesso si alleano con le tribù goblinoidi, guidate da capi goblin, capitani hobgoblin e bugbear, con gli sciamani che invocano gli spiriti in battaglia. Attaccano in gruppo con asce, giavellotti e mazze chiodate, e i loro capi, gli orog, sono guerrieri temuti.
