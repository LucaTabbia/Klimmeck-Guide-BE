- id: '68c19213541d89c481b83236'
  type: city
  name: Valantar
  description: |-
    È la capitale della repubblica dei Valan, nonché la più grande città di tutto il continente. Prende il nome dall’omonimo grande eroe Valantar e dalla sua stirpe, i Valan. è anche chiamata 'città forgia', grazie al numero elevato di fabbri presenti. Qui si trova il governo della repubblica, formato da un consiglio di anziani maghi chiamato 'Alti Savi'. Nella capitale è infatti anche presente l’Accademia di magia, un'altissima torre fortezza situata al centro della città e su cui si sviluppa verticalmente la città stessa. Al suo interno è presente la fonte magica, luogo in cui ogni avventuriero punta a raggiungere per poter sbloccare ed imparare l’utilizzo della magia. La città, l’accademia e la repubblica stessa hanno avuto principalmente un ruolo neutrale e imparziale nella storia del continente, in modo da poter servire ogni regno in caso di necessità.
  image: https://res.cloudinary.com/dzuhywp53/image/upload/v1757595096/main/cities/valantar_jht0vo.svg
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f51' # Repubblica dei Valan
