- id: '68c19213541d89c481b8322f'
  type: city
  name: Mirwen
  description: |-
    La città fortezza di Mirwen, situata sull’isola di Hingtos, è la capitale della Teocrazia di Mirwa. È spesso soggetta ciclicamente a pellegrinaggi religiosi che portano nuova merce di scambio e nuovi acquirenti, rendendola meta turistica e terra di scambi culturali. I suoi bianchi palazzi, le strade ciottolate e le mura circondate dal lago la rendono una città piena di fascino. Gode di un clima mite che permette la coltivazione di alberi di frutta, soprattutto agrumi, olivi e dell'uva. Quest'ultima viene utilizzata per la prosuzione dei suoi famosi vini. Nella città è presente la grande Cattedrale di Mirwa, dove l'alto sacerdote, nonché capo di stato, vive e e tiene cerimonie.
