- id: '68c19213541d89c481b83234'
  type: city
  name: Necrorian
  description: |-
    Necrorian, la città non-morta, è una città molto presente nelle leggende del continente. Si dice che al suo interno si siano tenute grandi battaglie e che i Lich ne abbiano fatto la propria casa insieme a qualsiasi altro tipo di nefandezza. Nessuno sa se esiste per davvero e i pochi che dicono di averla vista vengono presi per pazzi, soprattutto per la pericolosità del territorio che la circonda. L'arcipelago del Glounet è infatti un luogo abitato dalle bestie più pericolose del continente e in pochi ci si avventurano alla ricerca di ricchezze perdute e gloria.
  image: https://res.cloudinary.com/dzuhywp53/image/upload/v1757595093/main/cities/necrorian_lvdrxm.svg
