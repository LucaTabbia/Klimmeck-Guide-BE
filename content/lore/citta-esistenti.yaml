  type: city
  name: Liberia
  description: |-
    Liberia è una città stato con governo democratico, sviluppata nell’arcipelago del Calemark. Rinomata come città delle arti e del commercio, essendo una vera e propria potenza commerciale in grado di sovrastare per importanza anche l’Alleanza del mare nel suo periodo d’oro. Nella città sorge la più importante Scuola Bardica, chiamata Collegio Millhelm dal nome del fondatore e leggendario bardo Venis Millhelm. Questa città è infatti il centro nevralgico delle arti anche grazie alla grande presenza di mecenati. In questa città è presente l’unica banca del continente, La Banca Faris, a cui si sono affidati stati e regni in periodi di necessità, rendendo di fatto questa la vera potenza economica della città.
