- id: '68c19213541d89c481b83233'
  type: city
  name: Morrulir
  description: |-
    Morrulir è una gigantesca e antica città sotterranea, capitale del Regno della Madre. Grazie alle numerose rune magiche ivi presenti, possiede tecnologie avanzate rispetto agli altri regni. La città può vantare infatti cose come l’energia elettrica, funicolari e gru. Il territorio aspro, i macchinari avanzati e la potenza strategica delle gallerie sotterranee rendono questa cità difficile da conquistare, così come da gestire, motivo per cui non è stata mai coinvolta direttamente in guerre di potere e territorio. È la casa delle minoranze del continente, essendo uno dei luoghi più abitati dalla razza Nanica, Gnomica, Thiefling e Draconica.
  image: https://res.cloudinary.com/dzuhywp53/image/upload/v1757595095/main/cities/morrulir_vccu71.svg
