- id: '68c19213541d89c481b83231'
  type: city
  name: Bellport
  description: |-
    Anche conosciuta come 'il gioiello orientale', Bellport è una città marittima molto importante a livello commerciale. Essendo una delle 3 capitali dell'Unione delle Fiamme è anche un importante luogo di culto per gli adoratori del Culto dei Quattro. Essendo situata nel Belleholm settentrionale, le temperature non sono troppo alte e la rendono quindi una delle città più vivibili dell'arcipelago. I Phalan governano la città con attenzione da secoli ma, nonostante gli sforzi della famiglia, la criminalità organizzata continua ad essere molto presente nella capitale, rendendola una dei maggiori poli di smercio della Rugiada Notturna.
  image: https://res.cloudinary.com/dzuhywp53/image/upload/v1757595092/bellport_n9e6iu.svg
