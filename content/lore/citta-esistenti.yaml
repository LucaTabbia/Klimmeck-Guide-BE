- id: '68fd6e8b929ce8c0050b1764'
  type: city
  name: Ko Shaeras
  description: |-
    È la capitale degli elfi, immerda nella foresta del Minnely. La città è la casa delle casate più antiche e nobili degli elfi, che hanno costruito le proprie dimore su alberi colossali noti come 'Protettori Ancestrali'. La città è protetta da una barriera magica ancestrale, eretta per mantenere la pace e per separarsi dai problemi del mondo esterno. La città vive principalmente di agricoltura, allevamento e commercio con il regno di Drustea, di cui fa parte anche se mantiene la propria autonomia. Chi è entrato nella città spesso la descrive come un luogo mistico e spettacolare, che acceca con la propria bellezza.
  image: https://res.cloudinary.com/dzuhywp53/image/upload/v1761435134/elfCapital_fbv52w.svg
