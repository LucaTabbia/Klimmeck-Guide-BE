- id: '68c19213541d89c481b83230'
  type: city
  name: Cliffbreak
  description: |-
    Cliffbreak è una città di medie dimensioni, situata centralmente nel proprio regno e circondata da colline, ed è la capitale del regno di Drustea. Il clima freddo e le basse case di pietra e legno rendono questa città poco ospitale, ma dietro le sue mura si cela un commercio molto attivo e un via vai di persone di molto superiore alla maggior parte delle città del continente. Nella città è situato un colle con pendici a strapiombo. Questo colle in tempi di pace è semplicmente la casa della famiglia regnante, ma in tempi di guerra diventa un forte quasi insepugnabile e in grado di dare protezione a gran parte del popolo della capitale, anche per lunghi periodi di tempo.
