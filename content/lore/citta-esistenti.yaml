- id: '68c19213541d89c481b83237'
  type: city
  name: Virnen
  description: |-
    È la capitale centrale dell'Unione delle fiamme, nonché casa della famiglia Kerring e del Dio Mezaldir. La città, principalmente formata da alte torri in pietra, è circondata da vulcani attivi e si appoggia sul fiume Ferna. Nonostante non sia la città più a sud del Belleholm il caldo risulta comunque asfissiante e i vulcani presenti attorno ad essa la rendono particolarmente colpita da terremoti. Per questo, nonostante l'importanza territoriale, la città è poco popolata e frequentata. Nonostante questo, il commercio è comunque florido grazie al fiume navigabile che sfocia poi nel Delants. Nonostante l'apparenza austera, il popolo è estremamente accogliente e caloroso con gli stranieri, rendendo la città il posto adatto dove riposare e cercare ristoro dopo una pericolosa avventura nei territori confinanti.
  image: https://res.cloudinary.com/dzuhywp53/image/upload/v1757595094/main/cities/virnen_rpc5td.svg
