- id: '68c19213541d89c481b83235'
  type: city
  name: Talmvere
  description: |-
    Un piccolo villaggio del Regno di Drustea, situato ai piedi delle montagne e a ridosso delle froeste. Al suo interno si svolge una vità serena e semplice, ma una caratteristica rende questo paese diverso dagli altri. Situata centralmente si trova infatti una locanda rinomata in tutto il continente: Il Drago Ubriaco. Il giovane mezz'elfo che la gestisce è una figura di rilievo nel villaggio e si dice che fosse un avventuriero leggendario, motivo per cui tantissimi avventurieri si recano in questo villaggio alla ricerca di storie, compagnia e della famosa birra di Talmvere, ritenuta una delle migliori del continente.
  image: https://res.cloudinary.com/dzuhywp53/image/upload/v1757595093/talmvere_q12m1l.svg
