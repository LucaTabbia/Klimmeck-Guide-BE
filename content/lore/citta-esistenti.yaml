    - '6ae8001b906eac0adda59a45' # Guerin Kerring
  city: '690961f209cf5f26988106f4' # Virnen
- id: '68fd6bbe929ce8c0050b1760'
  type: city
  name: Telobren
  description: |-
    È la capitale meridionale dell'Unione delle fiamme, nonché casa della famiglia Telob e del Dio Fasmos. La città si affaccia sul mare ed è rinomata per le candide sabbie delle sue spiaggie. Il clima è tropicale, venendo quindi colpita da pioggie frequenti e copiose, asciugate poi rapidamente dal caldo sole. La città vive principalmente di pesca, allevamento e commercio via mare, ma l'economia risulta florida soprattutto grazie ai pirati che partono dal suo porto. La città soleggiata e colorata è vissuta da un popolo estramamente bellicoso, principalmente per motivi religiosi, tuttavia è facile entrarci in confidenza se si partecipa a qualche rissa nelle locande portuali.
  image: https://res.cloudinary.com/dzuhywp53/image/upload/v1761436505/flameSouthCapital_yn2ogj.svg
