- id: '68c19213541d89c481b83232'
  type: city
  name: Ferrion
  description: |-
    Il simbolo del fallimento della civiltà. Ferrion, la città prigione, è una fortezza inespugnabile situata nel luogo più freddo del continente: le isole Harken. Al suo interno migliaia di criminali vengono reclusi per il resto della loro vita, venendo obbligati a scavare alla ricerca di minerali mentre il freddo ne divora le ossa. Spesso la città viene usata come storiella per spaventare i bambini e farli comportare bene, anche se l'aspetto della città spesso risulta vago e inattendibile, data l'impossibilità di raggiungere la fortezza per vederla. La città è una zona franca ed è governata a turno da ogni fazione ad intervalli regolari di 5 anni.
  image: https://res.cloudinary.com/dzuhywp53/image/upload/v1757595093/ferrion_bnnvkh.svg
