- id: '6ae7fc3ed1f6494f3dc89f54'
  type: state # CityType: motherCapital, motherCity, motherVillage, mountainVillage, aarakocraVillage
  name: Regno della Madre
  description: |-
    Il primo regno del continente si stende sopra e sotto i monti del Lamstone: Nani, Gnomi e Tiefling vivono nel sottosuolo, i Draconidi sulle vette. Lo guida Skargen Monteaspro III, re e capo spirituale, dalla gigantesca capitale sotterranea di Morrulir. Pietre preziose, metalli e soprattutto le Rune magiche ne fanno il secondo stato più ricco e alimentano energia elettrica, funicolari e gru sconosciute altrove. Il Passo dei giganti scende verso il Chande, mentre le gallerie delle Vene della madre uniscono le città sotterranee.
