- id: '6ae7fc3ed1f6494f3dc89f56'
  type: state # CityType: ferrionCity
  name: Harken e Ferrion
  description: |-
    Nell'arcipelago dell'Harken, il più a nord del continente, sorge Ferrion, la Città Prigione che non appartiene a nessuno stato. Le sue leggi sono decise dalla Grande Adunanza, l'assemblea dei rappresentanti di ogni regno che si riunisce ogni cinque anni. La gestione della città passa da uno stato all'altro con la stessa cadenza. Sulle isole brulle e ghiacciate non cresce nulla e si sopravvive solo grazie alle navi delle provviste.
