- id: '6ae7fc3ed1f6494f3dc89f55'
  type: state # CityType: liberiaCapital, liberiaCity, liberiaVillage
  name: Liberia
  description: |-
    Città stato democratica nell'arcipelago del Calemark, Liberia è la potenza commerciale più ricca del continente. La sua flotta, ritenuta inaffondabile, controlla gran parte delle rotte oceaniche e la tiene lontana dalle guerre. Vi sorgono il Collegio Millhelm, la più importante scuola bardica, e la Banca Faris, l'unica del continente, guidata da Rufus Faris. Le isole sono legate dalla Rete dei ponti, ponti semimobili su cui sorgono case e botteghe.
