- id: '6ae7fc3ed1f6494f3dc89f51'
  type: state # CityType: valanCapital, valanCity, valanSeaCity, valanVillage, desertVillage
  name: Repubblica dei Valan
  description: |-
    Il secondo stato per estensione si allarga nel sud, fra il Temistos e i fiumi Talons e Mirwa, su pianure aperte e poco boscose. La capitale Valantar, la città più grande del continente, porta il nome dell'eroe che sconfisse il Re dei draghi ed è chiamata Città forgia per le sue fucine. Il Mar Sabbioso fornisce il Sundenim, il commercio di cavalli completa l'economia e nessuna invasione è mai riuscita a strappare queste ricchezze. Governano gli Alti Savi, consiglio di anziani maghi, e nella capitale sorge l'Accademia di magia, meta di ogni avventuriero.
