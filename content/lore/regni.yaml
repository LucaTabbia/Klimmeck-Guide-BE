# Regni e stati di Klimmeck (D-23): il commento CityType elenca i tipi di città del regno

- id: '6ae7fc3ed1f6494f3dc89f50'
  type: state # CityType: drusteaCapital, drusteaCity, drusteaSeaCity, drusteaVillage, elfCapital, talmvereVillage
  name: Regno di Drustea
  description: |-
    Il regno più vasto del continente occupa il nord, chiuso fra lo Stockcier, il Temistos e il Lamstone, e prende il nome dalla famiglia di monarchi che lo guida. La capitale è Cliffbreak, città di colline e pietra collegata al resto del regno dalla strada Chande. La ricchezza viene da agricoltura e allevamento, soprattutto luppolo e orzo per le birre più vendute di Klimmeck, mentre i villaggi del Minnely vivono di caccia, legname e pellicce. Le città marinare dell'est, un tempo Alleanza del Mare, sono state riannesse e decidono ancora tramite il Consiglio di Dummel e il suo Pacificatore. Nel regno sorgono anche Ko Shaeras, la città elfica alleata nascosta dalla magia, e il villaggio di Talmvere con la sua locanda.
