- id: '6ae7fc3ed1f6494f3dc89f52'
  type: state # CityType: mirwaCapital, mirwaCity, mirwaSeaCity, mirwaVillage
  name: Teocrazia di Mirwa
  description: |-
    Al centro del continente la Teocrazia prende il nome dalla dea Mirwa, l'unica divinità ammessa: venerare le altre è sacrilegio. La capitale è la città fortezza di Mirwen sull'isola di Hingtos, sede dell'alto sacerdote Alander XXI. Fra cave di montagna, pesca nel Nanfail, agrumi, olive e vigne, il regno produce gran parte del vino del continente, a cominciare dal Mirwanese. Il Cammino lucente, passo montano spesso interrotto dalle frane, unisce i villaggi dei laghi alle tre città esterne alla catena.
