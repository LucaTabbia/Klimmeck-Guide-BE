- id: '6ae7fc3ed1f6494f3dc89f53'
  type: state # CityType: flameNorthCapital, flameCenterCapital, flameSouthCapital, flameCity, flameVillage, tropicalVillage
  name: Unione delle Fiamme
  description: |-
    L'Unione lega i popoli del Belleholm e delle isole vicine per mezzo di una fede comune, senza un governo unico. I Phalan regnano da Bellport a nord, i Kerring da Virnen e i Telob da Telobren, mentre le terre restanti sono di città e villaggi indipendenti. Colture esotiche, pesca e ossidiana sostengono una popolazione povera ma raramente affamata, e la schiavitù è ancora permessa. Fra gli atolli si nascondono i pirati che smerciano la Rugiada notturna; le isole sono unite dal mare e dalla strada ramificata Pentabron.
