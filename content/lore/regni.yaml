- id: '6ae7fc3ed1f6494f3dc89f57'
  type: state # CityType: necrorianCity
  name: Necrorian e il Glounet
  description: |-
    L'arcipelago del Glounet è terra di nessuno, abitata solo da bestie magiche, mostri e non morti. Le sue isole boschive sono lo sfondo di grandi leggende e attirano avventurieri in cerca di fama. Si dice che vi sorgano villaggi di bestie magiche e la Città Non-Morta, Necrorian, ma chi dovesse scoprirne davvero l'esistenza difficilmente tornerebbe a raccontarlo.
