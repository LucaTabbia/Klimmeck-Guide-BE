# Animali (D-09, D-23): una lore animal per scheda della sezione «Animali» del documento

- id: '6ae8065202a77381730f280e'
  type: animal
  name: Pegaso
  description: |-
    Un magnifico cavallo dalle grandi ali d'uccello, alto quasi due metri al garrese e con sei metri di apertura alare; quasi sempre bianco, a volte di altri colori. È intelligente quanto un umano, timido e restio a stringere amicizie, e chi prova ad addestrarlo come cavalcatura lo scopre recalcitrante, perfino violento. Vive nelle foreste del Minnely. Preferisce non combattere, ma se costretto colpisce con gli zoccoli.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
- id: '6ae8065202a77381730f280f'
  type: animal
  name: Formiche giganti assassine
  description: |-
    Formiche nere lunghe circa due metri, onnivore, che attaccano qualunque cosa commestibile attraversi il loro cammino e trascinano la preda fino al nido. Una volta ingaggiate combattono fino alla morte, attraversando perfino il fuoco. Il nido, con una regina al suo interno, sembra una collina spoglia: per questo i viandanti incauti vengono spesso sorpresi e divorati. Vivono nelle zone collinari di tutto il continente e attaccano in gruppo con le fauci.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
    - '6ae7fc3ed1f6494f3dc89f62' # Pianure dei Valan
- id: '6ae8065202a77381730f2810'
  type: animal
  name: Aquile giganti
  description: |-
    Nobili uccelli da preda alti tre metri, con sei metri di apertura alare, che parlano una lingua propria e capiscono quelle delle altre razze. Talvolta collaborano con le creature buone e attaccano chi minaccia i loro nidi, spesso razziati per vendere uova e aquilotti a caro prezzo. Le giovani aquile si possono addestrare e sono apprezzate come cavalcature volanti. Nidificano sul Temistos e sul Lamstone e cacciano sulle pianure e colline vicine, scendendo in picchiata con artigli e becco.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
- id: '6ae8065202a77381730f2811'
  type: animal
  name: Worg
  description: |-
    Un predatore malvagio e astuto che si diletta nel cacciare e divorare le creature più deboli. Vaga per le terre selvagge di tutto il continente o viene allevato da goblin e hobgoblin, che lo usano come cavalcatura. Si rivolta contro il suo cavaliere se si sente maltrattato o affamato. Combatte con artigli e zanne.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
    - '6ae7fc3ed1f6494f3dc89f62' # Pianure dei Valan
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
    - '6ae804947fe539950fad17c8' # Goblin
- id: '6ae8065202a77381730f2812'
  type: animal
  name: Serpente stritolatore gigante
  description: |-
    Un serpente dalle proporzioni enormi, lungo fino a nove metri, con grandi scaglie, zanne ricurve e muscoli possenti. Vive soprattutto sulle isole del Belleholm. Tende imboscate lanciandosi dall'alto o avvicinandosi alla preda addormentata, la morde e la avvolge nelle sue spire fino a soffocarla lentamente.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
- id: '6ae8065202a77381730f2813'
  type: animal
  name: Megalodonte
  description: |-
    Il vero incubo dei mari: uno squalo lungo diciotto metri e pesante cinquanta tonnellate, culmine dell'evoluzione della sua specie. È la realtà dietro le leggende dei pesci capaci di inghiottire navi intere. Vive soltanto nell'oceano Delants. Attacca con le zanne e usa la sua velocità in acqua per soverchiare l'avversario.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f67' # Oceano Delants
- id: '6ae8065202a77381730f2814'
  type: animal
  name: Piovra gigante
  description: |-
    Un predatore aggressivo e territoriale con tentacoli lunghi sei metri e più, costellati di ventose acuminate. Cattura e divora squali, umani e qualunque cosa riesca ad afferrare. Vive in tutti gli oceani e nello stretto di Stratwin. Stritola le vittime con i tentacoli, acceca con l'inchiostro e si sposta in acqua con rapidità sorprendente.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f66' # Oceano Ladows
    - '6ae7fc3ed1f6494f3dc89f67' # Oceano Delants
    - '6ae7fc3ed1f6494f3dc89f68' # Stretto di Stratwin
- id: '6ae8065202a77381730f2815'
  type: animal
  name: Lupo invernale
  description: |-
    Una variante del Worg più grande, furba e feroce, dal pelo bianco e dal soffio gelido: è lungo due metri e mezzo e pesa più di duecento chili. Spesso si allea con i giganti e con altri umanoidi, servendo intere tribù come esploratore e guardiano. Vive sui Lamstone più a nord e nelle isole Harken. Morde e investe le prede con un soffio di ghiaccio.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f63' # Lontano Nord
    - '6ae7fc3ed1f6494f3dc89f5e' # Harken
- id: '6ae8065202a77381730f2816'
  type: animal
  name: Lupo
  description: |-
    Solitari o in branco, i lupi sono all'apice della catena alimentare e difendono con ferocia vasti territori di caccia. Le zampe leggermente palmate li aiutano sulla neve, il pelo spesso e impermeabile va dal grigio al nero, e le ghiandole odorifere segnano il passaggio per gli altri membri del branco. Vivono su tutte le montagne e nelle foreste del continente. Combattono in gruppo con zanne e artigli.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
    - '6ae7fc3ed1f6494f3dc89f63' # Lontano Nord
- id: '6ae8065202a77381730f2817'
  type: animal
  name: Orso grigio
  description: |-
    Un onnivoro grande e potente, detto anche grizzly, ghiotto di noccioline, bacche, pesce e piccoli mammiferi. È estremamente territoriale e dà la caccia a qualunque intruso. Vive nel nord del continente e sulle isole Harken. Colpisce con artigli e zanne, afferra un solo bersaglio e lo colpisce senza sosta, o lo butta a terra con il peso del corpo.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f63' # Lontano Nord
    - '6ae7fc3ed1f6494f3dc89f5e' # Harken
- id: '6ae8065202a77381730f2818'
  type: animal
  name: Alce
  description: |-
    Le alci pascolano in grandi mandrie attraverso pianure, colline e foreste, e si adattano senza problemi ai cambiamenti del clima. Alte fino a un metro e mezzo al garrese, la loro taglia e le loro corna tengono lontana la maggior parte dei pericoli, anche se la mandria preferisce fuggire. Vivono in tutte le foreste. Quando combattono caricano con le corna per buttare a terra l'avversario.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
- id: '6ae8065202a77381730f2819'
  type: animal
  name: Cinghiale
  description: |-
    Molto più irascibile e pericoloso dei suoi simili addomesticati, il cinghiale è un onnivoro comune nelle foreste temperate e si adatta anche al clima tropicale, dove i facoceri popolano pianure e savane. La sua carne è considerata prelibata, e lo si caccia con lance dotate di una traversa che impedisce alla bestia trafitta di incornare il cacciatore. Vive in tutte le foreste. Carica l'avversario con le zanne.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
- id: '6ae8065202a77381730f281a'
  type: animal
  name: Cinghiale gigante
  description: |-
    Feroce e violento, lungo tre metri e pesante una tonnellata, il cinghiale gigante preferisce la carne a ogni altro cibo e attacca chiunque incontri o entri nel suo territorio. Gli orchi più coraggiosi lo usano come cavalcatura, e la loro cavalleria è una forza spaventosa. Vive nel nord del continente, sulle isole più settentrionali e nei villaggi degli orchi che lo allevano. Carica con le zanne e si dice continui a lottare anche quando è morente.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f63' # Lontano Nord
    - '6ae7fc3ed1f6494f3dc89f5e' # Harken
- id: '6ae8065202a77381730f281b'
  type: animal
  name: Squalo tropicale
  description: |-
    Più piccolo degli squali giganti, lungo da uno a tre metri, lo squalo tropicale infesta le acque basse e le barriere coralline. Caccia in piccoli branchi. Vive attorno al Belleholm e nell'arcipelago di Liberia, e attacca con le zanne insieme ai suoi simili.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f5d' # Calemark
    - '6ae7fc3ed1f6494f3dc89f67' # Oceano Delants
    - '6ae7fc3ed1f6494f3dc89f66' # Oceano Ladows
- id: '6ae8065202a77381730f281c'
  type: animal
  name: Squalo di sabbia
  description: |-
    Un mostro bizzarro del deserto, con scaglie marroni e nere a forma di diamante, un muso da squalo pieno di denti aghiformi, zampe simili a pinne artigliate e spine dorsali che tagliano la sabbia come lame. Scava appena sotto la superficie e può sparire del tutto per passare inosservato; se non sottomette la preda in fretta si immerge e cerca prede più facili. Vive soltanto nel Mar Sabbioso, dove viene usato anche per il trasporto. Colpisce di sorpresa con le zanne da sotto la sabbia.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
- id: '6ae8065202a77381730f281d'
  type: animal
  name: Cavallo e Cavallo da guerra
  description: |-
    I cavalli sono alti al garrese fra un metro e mezzo e un metro e ottanta e pesano fra i cinquecento e i settecentocinquanta chili. I più agili sono chiamati cavalli leggeri, mentre i più grandi e forti vengono addestrati come cavalli da guerra. Si trovano e vengono allevati soprattutto nella Repubblica dei Valan. Combattono con gli zoccoli.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f62' # Pianure dei Valan
    - '6ae7fc3ed1f6494f3dc89f51' # Repubblica dei Valan
- id: '6ae8065202a77381730f281e'
  type: animal
  name: Pantera
  description: |-
    Una grande bestia felina dal corpo muscoloso e dalla lunga coda, con il mantello marrone chiaro talvolta macchiato di rosette nere e occhi gialli o verdi. Ha mascelle potenti, denti affilati e artigli retrattili, e può superare i due metri e mezzo di lunghezza. Vive nel Belleholm. Balza sulla preda e la colpisce con artigli e zanne.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
- id: '6ae8065202a77381730f281f'
  type: animal
  name: Iena
  description: |-
    Cacciatrici famose per l'astuzia e per i latrati simili a una risata, le iene sono soprattutto spazzine, ma integrano le carogne con carne fresca. Quando cacciano in branco mandano uno o due membri ad affrontare il nemico mentre gli altri lo aggirano e lo attaccano alle spalle. Vivono nelle zone meridionali del continente e nel Belleholm. Combattono in branco con le zanne.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f65' # Coste del meridione
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
- id: '6ae8065202a77381730f2820'
  type: animal
  name: Coccodrillo
  description: |-
    Un rettile primitivo lungo più di quattro metri, che vive nelle paludi e lungo le rive dei fiumi, dove le prede si avvicinano ignare all'acqua per bere. Ne esistono specie anche più grandi. Vive soprattutto nelle Paludi maledette e nel Belleholm. Spunta dall'acqua all'improvviso e afferra la preda con le zanne.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f64' # Paludi maledette
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
- id: '6ae8065202a77381730f2821'
  type: animal
  name: Vespa gigante
  description: |-
    Insetti alti tre metri che vivono in nidi con una regina, alcuni lavoratori e molti soldati che proteggono il nido e cacciano il cibo. I nidi sorgono in caverne, case abbandonate o qualunque luogo abbastanza grande da contenere una dozzina di questi insetti. Si trovano in molte caverne del profondo sud del continente e nel Belleholm. Attaccano in sciame con pungiglioni velenosi.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f65' # Coste del meridione
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
- id: '6ae8065202a77381730f2822'
  type: animal
  name: Avvoltoio
  description: |-
    Imparentati con i rapaci, gli avvoltoi si nutrono per lo più di carogne che scorgono e fiutano dall'alto, e preferiscono i cadaveri freschi a quelli putrescenti. Hanno artigli deboli, ma il becco adunco strappa la carne con la rapidità di una lama, e quando il cibo scarseggia cacciano prede piccole. Vivono nel Belleholm e nel Mar Sabbioso. Attaccano con becco e artigli.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f5b' # Mar Sabbioso
- id: '6ae8065202a77381730f2823'
  type: animal
  name: Tigre
  description: |-
    Alte più di novanta centimetri al garrese, lunghe quasi tre metri e pesanti fino a trecento chili, le tigri sono i principali predatori dei loro territori: uccidono serpenti giganti, lupi e perfino altri grandi felini. Nemmeno gli umanoidi sono al sicuro, specie se una tigre ne ha preso il gusto. Vivono nel sud del continente e cacciano tendendo imboscate dal fogliame, vicino all'acqua. Balzano sul bersaglio e lo colpiscono con zanne e artigli.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f65' # Coste del meridione
    - '6ae7fc3ed1f6494f3dc89f62' # Pianure dei Valan
