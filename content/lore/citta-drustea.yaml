- id: '6ae8083e7bdab32d55c00e64'
  type: city
  name: Rivalago
  description: |-
    Rivalago è un villaggio del Regno di Drustea sulle rive di un piccolo lago delle pianure del nord. Nei dintorni sorgono rovine antiche e l'ingresso di un sotterraneo che attira avventurieri da ogni parte del regno. Gli abitanti vivono di pesca e agricoltura e vendono provviste a chi tenta la sorte.
  image: null
