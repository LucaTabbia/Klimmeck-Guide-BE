- id: '6ae8083e7bdab32d55c00e65'
  type: city
  name: Shando
  description: |-
    Shando è un villaggio di Drustea al confine con le Paludi maledette, dove la pianura cede il passo all'acqua stagnante. Rovine, un vecchio campo di battaglia e un sotterraneo circondano il paese, che vive in un perenne stato di allerta. Pochi viaggiatori vi si fermano, e quasi tutti sono avventurieri.
  image: null
