- id: '6ae8083e7bdab32d55c00e63'
  type: city
  name: Grens
  description: |-
    Grens è un villaggio delle pianure di Drustea accanto a un vecchio cimitero. La vita scorre lenta fra campi e stalle, ma i becchini del villaggio sono i più ricercati della zona. Si racconta che qualcosa si muova fra le tombe nelle notti senza luna.
  image: null
