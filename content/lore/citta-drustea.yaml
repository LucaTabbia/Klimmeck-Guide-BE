- id: '6ae8083e7bdab32d55c00e62'
  type: city
  name: Gemsall
  description: |-
    Gemsall è un villaggio delle pianure di Drustea, tranquillo e dedito ai campi. I suoi abitanti producono orzo per le birrerie del regno e allevano bestiame. Poche cose accadono a Gemsall, ed è proprio questo che i suoi abitanti amano.
  image: null
  relatedLore:
