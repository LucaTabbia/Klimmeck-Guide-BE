- id: '6ae8083e7bdab32d55c00e5f'
  type: city
  name: Elessa
  description: |-
    Elessa è un piccolo villaggio delle pianure di Drustea, nato accanto a un antico campo di battaglia. La gente vive di agricoltura e allevamento e accoglie volentieri i viandanti del Chande. Si dice che nelle notti di nebbia si sentano ancora i corni delle vecchie guerre.
  image: null
