- id: '6ae8083e7bdab32d55c00e5a'
  type: city
  name: Ufragos
  description: |-
    Ufragos è una città delle pianure di Drustea, fra distese di luppolo e orzo che si perdono all'orizzonte. Le sue birrerie sono fra le più antiche del regno e attirano mercanti da tutto il continente. La strada Chande la collega alla capitale Cliffbreak.
  image: null
