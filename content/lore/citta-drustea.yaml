- id: '6ae8083e7bdab32d55c00e5d'
  type: city
  name: Portonuovo
  description: |-
    Portonuovo è una città di mare della costa orientale di Drustea, già membro dell'Alleanza del mare. Il suo porto sul Delants ha visto partire navi mercantili e flotte da guerra, e un antico campo di battaglia ricorda gli scontri con l'Unione e la Teocrazia. Il commercio oceanico si è indebolito, ma la città conserva il suo seggio nel Consiglio di Dummel.
  image: null
