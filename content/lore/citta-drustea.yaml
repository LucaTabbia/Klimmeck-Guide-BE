- id: '6ae8083e7bdab32d55c00e60'
  type: city
  name: Flevale
  description: |-
    Flevale è un villaggio del Regno di Drustea al margine fra le pianure e un bosco fitto. Vive di raccolta, caccia e della vendita di legname ai mercati delle città vicine. La sua piccola locanda è una tappa amata da chi percorre le strade del nord.
  image: null
  relatedLore:
