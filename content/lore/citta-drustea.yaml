- id: '6ae8083e7bdab32d55c00e61'
  type: city
  name: Flinas
  description: |-
    Flinas è un villaggio del Regno di Drustea fra le colline, lontano dalle strade principali. Un portale demoniaco aperto nei dintorni ha reso il luogo pericoloso e molti abitanti se ne sono andati. L'esercito del regno vi manda pattuglie per riprendere il territorio ai mostri.
  image: null
  relatedLore:
