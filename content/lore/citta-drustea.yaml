- id: '6ae8083e7bdab32d55c00e5c'
  type: city
  name: Blu Minore
  description: |-
    Blu Minore è una città di mare di Drustea, sorella più piccola di Blu Maggiore sulla costa del Delants. Un tempo parte dell'Alleanza del mare, oggi vive di pesca e dei traffici delle compagnie commerciali. Le sue banchine sono più tranquille di quelle della vicina, ma non meno affollate di marinai.
  image: null
