  type: city
  name: Umale
  description: |-
    Umale è un villaggio del Regno di Drustea nelle pianure, vicino a rovine e a un cimitero dimenticato. Gli abitanti vivono di agricoltura e di qualche commercio con le carovane del Chande. Come molti paesi dell'interno, soffre la povertà degli ultimi anni.
