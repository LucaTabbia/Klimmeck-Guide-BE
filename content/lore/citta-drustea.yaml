- id: '6ae8083e7bdab32d55c00e58'
  type: city
  name: Qey
  description: |-
    Qey è una città delle pianure di Drustea, cresciuta attorno a un crocevia del Chande. Vive di cereali, bestiame e del passaggio continuo di carovane. Come molte città dell'interno, negli ultimi anni ha visto crescere la povertà nei quartieri più umili.
  image: null
  relatedLore:
