- id: '6ae8083e7bdab32d55c00e56'
  type: city
  name: Daracre
  description: |-
    Daracre è una città delle pianure di Drustea, cuore agricolo del regno fra campi d'orzo e allevamenti. Le sue birrerie riforniscono le locande di mezzo continente lungo il Chande. A sud della città, nei pressi della foresta Gansha, sorge il villaggio di Talmvere.
  image: null
