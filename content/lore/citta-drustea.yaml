  type: city
  name: Ulby
  description: |-
    Ulby è un villaggio delle pianure di Drustea fra rovine e antichi campi di battaglia. I contadini trovano spesso cocci e frammenti di armature fra i solchi. La gente è dura e diffidente, segnata dalle guerre combattute su queste terre.
  image: null
