- id: '6ae8083e7bdab32d55c00e59'
  type: city
  name: Tipus
  description: |-
    Tipus è una città del Regno di Drustea circondata dai campi delle pianure del nord. Fuori dalle mura si stende un vecchio cimitero, che gli abitanti evitano dopo il tramonto. Le sue locande sono note per la birra scura e per le storie di fantasmi raccontate davanti al fuoco.
  image: null
  relatedLore:
