  type: city
  name: Vindence
  description: |-
    Vindence è un villaggio di Drustea al limitare di un bosco, accanto a un vecchio cimitero. Vive di legname, caccia e piccoli raccolti. Gli abitanti sono superstiziosi e chiudono le porte al calare del sole.
