  type: city
  name: Brurora
  description: |-
    Brurora è un villaggio del Regno di Drustea fra colline, boschi e pianure coltivate. I contadini coltivano orzo e luppolo, mentre i più giovani cacciano nei boschi vicini. Un vecchio campo di battaglia poco lontano restituisce ancora armi arrugginite dopo ogni aratura.
  image: null
