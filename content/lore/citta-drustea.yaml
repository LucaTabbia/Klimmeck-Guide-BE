- id: '6ae8083e7bdab32d55c00e57'
  type: city
  name: Gran Porto
  description: |-
    Gran Porto è una città del Regno di Drustea adagiata fra le colline, nonostante un nome che ricorda i tempi in cui i suoi mercanti dominavano i traffici del regno. Le sue strade in salita portano ancora botteghe e magazzini, mentre fra le alture si apre un sotterraneo che pochi osano esplorare.
  image: null
  relatedLore:
