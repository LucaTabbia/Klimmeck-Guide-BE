- id: '6ae8083e7bdab32d55c00e5b'
  type: city
  name: Blu Maggiore
  description: |-
    Blu Maggiore è una città di mare della costa orientale di Drustea, affacciata sull'Oceano Delants. Fu una delle quattro città dell'Alleanza del mare e i suoi mercanti siedono ancora nel Consiglio di Dummel. Le compagnie commerciali del porto ne fanno una delle città più ricche del regno.
  image: null
  relatedLore:
