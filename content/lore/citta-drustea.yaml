# Lore delle città del Regno di Drustea (D-23): una voce type city per città, campo solo-file city con l'id dello snapshot

- id: '6ae8083e7bdab32d55c00e55'
  type: city
  name: Atheland
  description: |-
    Atheland è una città del Regno di Drustea che sorge sulle pianure del nord, lungo il tracciato del Chande. I suoi mercati vivono del grano e del luppolo dei campi vicini, ma la vicinanza di un portale demoniaco tiene la guarnigione sempre all'erta. Gli avventurieri vi trovano lavoro più spesso di quanto vorrebbero gli abitanti.
