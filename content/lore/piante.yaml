# Piante (D-07, D-23): una lore plant per scheda della sezione «Piante» del documento

- id: '6ae8065202a77381730f2824'
  type: plant
  name: Lumella
  description: |-
    Una pianta diffusa in tutto il continente e dalla crescita rapidissima: in pochi mesi dalla semina fa sbocciare il suo fiore, di solito all'inizio della primavera. I petali, giallo paglierino e a forma di goccia, servono per infusi e tisane calmanti e digestive. Il culto di Nydos la usa in alcune cerimonie, ed è per questo che il fiore è chiamato anche «Fiore del sole».
  image: null
