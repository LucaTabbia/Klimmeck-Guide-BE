    - '6ae7fc3ed1f6494f3dc89f62' # Pianure dei Valan
- id: '6ae8065202a77381730f2829'
  type: plant
  name: Bandiera mortuaria
  description: |-
    Un fungo che cresce vicino ai cimiteri e ovunque ci siano carcasse, nutrendosi dei tessuti in decomposizione dopo le lunghe piogge. Il cappello è bianco e largo, coperto di piccoli bubboni neri e lucidissimi simili a gocce. È velenosissimo: provoca vomito, dolori fortissimi, vertigini e la necrosi del fegato, fino alla morte. Se ne ricava il «Rancore nero», un veleno dagli stessi effetti ma rapidissimo, di cui bastano poche gocce.
  image: null
  relatedLore: []
- id: '6ae8065202a77381730f282a'
  type: plant
  name: Cuffia gialla
  description: |-
    Un piccolo fungo giallo acceso che cresce in tutte le foreste, sotto le fronde dei grandi alberi e nei luoghi umidi, solo in autunno e per poche settimane. È commestibile se si sciacquano con cura le lamelle, perché il veleno sta nelle spore: intorpidisce, addormenta e, in quantità, paralizza. Dalle lamelle si ricava l'«Ultimo bacio», un veleno che agisce anche su tagli e ferite e uccide paralizzando a poco a poco tutto il corpo, fino al cuore e al respiro.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
    - '6ae7fc3ed1f6494f3dc89f61' # Pianure di Drustea
- id: '6ae8065202a77381730f282b'
  type: plant
  name: Carissia
  description: |-
    Una pianta sempreverde dei climi freddi, diffusa soprattutto nel nord del continente, che fiorisce solo d'estate. I boccioli bianchi, schiacciati e tondi, somigliano a monete; la corolla aperta è biancastra con riflessi azzurrini e verde acqua. I maghi ne fanno un infuso che migliora concentrazione e vista ed è energizzante e rivitalizzante.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f63' # Lontano Nord
    - '6ae7fc3ed1f6494f3dc89f7c' # La magia di Klimmeck
- id: '6ae8065202a77381730f282c'
  type: plant
  name: Protettori ancestrali
  description: |-
    Alberi che crescono soltanto nelle foreste al centro del continente, soprattutto nel Minnely, e vivono per millenni: in un secolo raggiungono duecento metri di altezza e cinquanta di spessore alla base. Le grandi foglie palmate passano dal verde chiaro dell'estate al giallo e all'arancione dell'autunno. Fra le fronde maturano frutti duri e nutrienti, simili a grandi nocciole, che si cucinano in molti modi o diventano farina. Sono così grandi che animali e umanoidi ci costruiscono case e villaggi: gli Elfi hanno eretto sui loro tronchi e sulle loro fronde Ko Shaeras, la città più grande della loro razza.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f60' # Foresta di Minnely
    - '68fd6e8b929ce8c0050b1764' # Ko Shaeras
