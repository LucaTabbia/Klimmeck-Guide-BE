- id: '6ae8065202a77381730f2825'
  type: plant
  name: Serendica
  description: |-
    Una pianta violacea, quasi nera in ogni sua parte, che cresce nella penombra dei luoghi umidi: nelle paludi, nel Belleholm e sotto gli alberi vicini all'acqua. Il fiore ha petali lunghi e separati con grandi pistilli sporgenti; d'inverno la pianta riposa, nel resto dell'anno fiorisce di continuo e dà frutti quattro o cinque volte. I frutti sono tossici, ma distillati danno il Notturno, un liquore scuro e zuccherino che rilassa e rallegra. Chi ne abusa soffre di paranoia e allucinazioni e il giorno dopo paga con sete, stanchezza e nausea, ma il Notturno non dà dipendenza.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f64' # Paludi maledette
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
- id: '6ae8065202a77381730f2826'
  type: plant
  name: Vespro argenteo
  description: |-
    Un fiore argenteo dai petali tondi e soffici che si apre al tramonto e si richiude all'alba; cresce soltanto nel Belleholm. I petali hanno un sapore zuccherino e delicato e si raccolgono come cibo. Dai petali più interni si ricava la Rugiada notturna, una sostanza euforizzante e anestetica che dà facilmente dipendenza. Chi ne abusa e ne resta senza può morire di astinenza.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f5c' # Belleholm
    - '6ae7fc3ed1f6494f3dc89f7a' # Rugiada notturna
- id: '6ae8065202a77381730f2827'
  type: plant
  name: Lacrime della vergine
  description: |-
    Una pianta che cresce soltanto su acque calme, senza correnti e dal fondale basso e melmoso. Il fiore sboccia all'inizio dell'estate e rilascia polline fino a metà autunno; i petali, bianchi con striature rosse, sono troppo amari per essere mangiati. Le foglie spesse e carnose, invece, hanno un sapore neutro, finiscono in molti piatti e sono ricche di nutrienti. Il fiore è sacro al culto di Mirwa, che lo usa nelle sue cerimonie.
  image: null
  relatedLore:
