- id: '6ae8065202a77381730f2828'
  type: plant
  name: Rosa del viaggiatore
  description: |-
    Un piccolo cespuglio sempreverde e rossastro che cresce in quasi tutte le praterie e nei campi e si riproduce per spore. Le foglie mature sono rosse, quelle nuove di un verde acceso. Sono commestibili ma amare, e soprattutto si usano come impacchi sulle ferite: cicatrizzano, disinfettano e calmano il dolore.
  image: null
  relatedLore:
