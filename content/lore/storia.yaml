- id: '6ae7fc3ed1f6494f3dc89f71'
  type: knowledge
  name: La Liberica e il cambio
  description: |-
    La Liberica è la moneta unica del continente e prende il nome da Liberia, dove nacque insieme alla Banca Faris. Si divide in monete di rame, d'argento e d'oro, con il cambio 10000 rame = 100 argento = 1 oro. Un boccale di birra costa 2 o 3 rame, una stanza per la notte 20 rame e una pozione di guarigione 50-70 rame. Per una spada di bassa qualità servono 1 argento e 50 rame, per un anello magico 3 argento, mentre la casa di un nobile arriva a 1 oro e 20 argento.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f55' # Liberia
    - '6ae7fc3ed1f6494f3dc89f75' # Liberica
- id: '6ae7fc3ed1f6494f3dc89f72'
  type: knowledge
  name: Il potere economico degli stati
  description: |-
    Liberia è lo stato più ricco grazie alla flotta, alla Banca Faris e al Collegio Millhelm, seguita dalla Teocrazia di Mirwa, forte di pellegrinaggi, vini e frutti, e dal Regno della Madre, che vende rune e minerali preziosi. La Repubblica dei Valan cresce piano ma stabile con cavalli, armi e Sundenim. Il Regno di Drustea, impoverito dalle guerre e dai dazi più bassi, è penultimo e investe in nuove banche e terre da coltivare. Ultima è l'Unione delle Fiamme, divisa da lotte interne, dove però pesca e agricoltura tengono lontana la fame.
  image: null
