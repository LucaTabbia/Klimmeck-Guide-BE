# Storia ed economia di Klimmeck (D-23)

- id: '6ae7fc3ed1f6494f3dc89f69'
  type: knowledge
  name: Le origini
  description: |-
    All'inizio esisteva solo il Piano Divino, dove le prime divinità vivevano nell'ozio finché la noia non le spinse a creare. Nydos e Wirasil si separarono per dare vita alla luce e all'oscurità, e Neleala vi plasmò una terra di vulcani ardenti. Mirwa la bilanciò con fiumi, mari e laghi, trasformando i vulcani in montagne di sorgenti, ed Enayr vi fece nascere piante e animali. Così nacque il Piano Materiale, che attirò lo sguardo di sempre più dei.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f6a' # La creazione dei piani e delle prime razze
- id: '6ae7fc3ed1f6494f3dc89f6a'
  type: knowledge
  name: La creazione dei piani e delle prime razze
  description: |-
    Teheia trasse dal caos i mostri e i Draghi, e Neleala rispose trasformando montagne nei Giganti: la loro guerra durò millenni senza vincitori. Enayr usò l'Albero della Vita, dove oggi cresce il Minnely, per creare Elfi, Treant e Driadi, mentre Neleala diede ai monti i Nani. Mobus e Teheia plasmarono gli Umani, e dal caos escluso nacquero i Diavoli con il loro Piano Demoniaco. Seguirono gli Aarakocra e la licantropia di Lizdum, i Draconidi, gli Halfling, gli Gnomi e infine gli Orchi di Xellmar, sconfitti e ricacciati a nord; Wirasil, geloso della luce, creò il Piano Oscuro.
  image: null
  relatedLore:
