- id: '6ae7fc3ed1f6494f3dc89f70'
  type: knowledge
  name: La sesta era
  description: |-
    È l'era in cui si narrano gli eventi della locanda e degli avventurieri. Contro i portali demoniaci nacque la Gilda dei Cacciatori, che trasformò l'avventura in un mestiere con incarichi, compensi e gradi. L'Unione delle Fiamme, alleata con la Teocrazia di Mirwa, costrinse Drustea ad abbassare i dazi, e la Grande Adunanza costruì nell'Harken la Città Prigione di Ferrion per i criminali più pericolosi. Da poco l'Alleanza del Mare è tornata sotto Drustea, e la Tassa di scissione alimenta ancora piccole ribellioni.
