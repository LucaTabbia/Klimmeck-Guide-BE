- id: '6ae7fc3ed1f6494f3dc89f6f'
  type: knowledge
  name: La quinta era
  description: |-
    Tanelia Ularen, eletta di Naleala, aprì il Regno della Madre ai Tiefling e ai Draconidi, rendendolo la casa di più razze. Dummel Regis fondò l'Alleanza del Mare staccando le città orientali da Drustea in cambio della Tassa di scissione, mentre a Liberia Malon Faris aprì la Banca Faris e creò la Liberica. La Teocrazia di Mirwa, finanziata dalla banca, strappò alla Repubblica dei Valan le terre del nord, e poco dopo l'Unione delle Fiamme tentò invano le coste orientali della repubblica. L'era finì quando la Liberica divenne la moneta unica di Klimmeck.
