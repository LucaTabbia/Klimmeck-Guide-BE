- id: '6ae7fc3ed1f6494f3dc89f6e'
  type: knowledge
  name: La quarta era
  description: |-
    Un'era di pace, segnata solo da piccoli scontri con i popoli demoniaci, in cui i regni crebbero e ampliarono i commerci. Nel Calemark i villaggi di pescatori si ingrandirono attorno al Collegio Millhelm. I Diavoli impararono a usare le tecniche della magia col potere del caos e cominciarono ad aprire portali in tutto il continente, da cui fuggirono anche molti Tiefling. L'era terminò quando le quattro divinità della fortuna scesero nel Belleholm e guidarono le sue tribù a fondare l'Unione delle Fiamme.
  image: null
