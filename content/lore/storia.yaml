- id: '6ae7fc3ed1f6494f3dc89f6b'
  type: knowledge
  name: La prima era
  description: |-
    Un'era placida in cui i popoli formarono piccole comunità senza mescolarsi e commerciavano solo col baratto. Teheia, adirata con Mobus, creò Goblin, Hobgoblin, Troll e Ogre, che dal sottosuolo e dai margini del continente iniziarono ad espandersi. Ne nacque la Guerra del sottosuolo contro i Nani del Lamstone, vinta dopo quasi due secoli grazie all'eroe Vozaed Ferroscuro. Con la fondazione del Regno della Madre e di Morrulir, primo regno e prima vera città del continente, l'era si chiuse.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f54' # Regno della Madre
    - '6ae7fc3ed1f6494f3dc89f58' # Lamstone
- id: '6ae7fc3ed1f6494f3dc89f6c'
  type: knowledge
  name: La seconda era
  description: |-
    Mobus si divise col filo del destino e la sua parte terrena, Edite, creò la magia: una fonte di potere divino sorta a sud del Temistos, dove crebbe la capitale dell'Impero Ekonem. Un mago aprì per errore un portale sul Piano Demoniaco e, ingannato dal diavolo Jur'gath in un patto per l'immortalità, divenne il primo vampiro. I grandi maghi guidati da Orgeal cacciarono demoni e rinnegati, chiusero la fonte in una barriera dentro quella che sarebbe diventata l'Accademia e fondarono il consiglio dei Savi. Nacquero le prime monete, e l'era finì con la scomparsa di Orgeal, primo imperatore degli umani.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f51' # Repubblica dei Valan
    - '6ae7fc3ed1f6494f3dc89f59' # Temistos
- id: '6ae7fc3ed1f6494f3dc89f6d'
  type: knowledge
  name: La terza era
  description: |-
    Un'era breve che vide nascere il Regno di Drustea, quando una famiglia di guerrieri nordici unì i popoli del nord contro i mostri. Il Re dei draghi Amaerith distrusse la capitale dell'Impero Ekonem, indebolito da Savi litigiosi, e ne fece la roccaforte della sua razza. Hilword Valantar, eletto da Aphine, unì tutti i popoli, perfino il Regno della Madre e gli elfi del Minnely, e vinse Amaerith in duello; i draghi superstiti fuggirono sul Lamstone, nel Mar Sabbioso e sui vulcani del Belleholm. Dalla capitale ricostruita nacque la Repubblica dei Valan, e l'era si chiuse con la fondazione della Teocrazia di Mirwa.
  image: null
