- id: '6ae8083e4b590da5989f9fd9'
  type: city
  name: Granponte
  description: |-
    Granponte è una città dei Valan che prende il nome dal grande ponte di pietra su cui passa il Chande. Le pianure attorno sono segnate da rovine e da un antico campo di battaglia, ricordo delle guerre per le materie prime della repubblica. Oggi è un vivace punto di scambio di cavalli e armature.
