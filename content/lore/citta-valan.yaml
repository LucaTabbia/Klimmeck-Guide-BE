  type: city
  name: Numstegh
  description: |-
    Numstegh è una città dei Valan nelle pianure meridionali, nota per i suoi allevamenti di cavalli. Rovine e un antico campo di battaglia circondano le sue mura, testimoni delle invasioni mai riuscite. Le sue scuderie forniscono destrieri a mezza repubblica.
