- id: '6ae8083e4b590da5989f9fd8'
  type: city
  name: Flushhelm
  description: |-
    Flushhelm è una città della Repubblica dei Valan nelle pianure del sud, cresciuta accanto a rovine di un'epoca dimenticata. Le sue fucine lavorano il Sundenim che arriva dal Mar Sabbioso e ne ricavano armi apprezzate in tutto il continente. Il consiglio cittadino risponde agli Alti Savi di Valantar.
