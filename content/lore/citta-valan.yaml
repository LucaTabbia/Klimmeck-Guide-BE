  type: city
  name: Blu Aragh
  description: |-
    Blu Aragh è una città di mare della Repubblica dei Valan, affacciata sulle coste del meridione. Il suo porto commercia direttamente con Drustea e Liberia, evitando i dazi della Teocrazia. Un vecchio campo di battaglia vicino alla costa ricorda gli sbarchi respinti nei secoli.
