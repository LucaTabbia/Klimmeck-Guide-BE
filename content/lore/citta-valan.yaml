  type: city
  name: Marbot
  description: |-
    Marbot è una città della Repubblica dei Valan fra le pianure del sud, accanto a rovine e a un vecchio cimitero. Un portale demoniaco aperto nei dintorni ha reso necessaria una guarnigione permanente. I fabbri della città forgiano lame per i soldati e per gli avventurieri di passaggio.
