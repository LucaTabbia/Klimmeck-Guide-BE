  type: city
  name: Springford
  description: |-
    Springford è una città della Repubblica dei Valan sorta presso un guado delle pianure del sud. Il commercio di cavalli e di attrezzi forgiati la rende prospera e ordinata. Fra i campi vicini affiorano rovine che attirano studiosi e cercatori di tesori.
