  type: city
  name: Tinemoor
  description: |-
    Tinemoor è una città dei Valan sulle pianure meridionali, nota per le sue fucine. Un portale demoniaco nelle vicinanze ha costretto la città a fortificarsi e a reclutare spesso avventurieri. I maghi dell'Accademia di Valantar la visitano per studiare il fenomeno.
