- id: '6ae809f3c1a73223f1410eb2'
  type: city
  name: Mison
  description: |-
    Mison è una città dello stato di Liberia nell'interno di un'isola del Calemark. È nota per le sue botteghe di strumenti musicali, che riforniscono gli artisti del Collegio Millhelm. Un vecchio cimitero sulla collina custodisce le tombe di bardi celebri.
