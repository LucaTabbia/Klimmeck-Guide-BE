- id: '6ae809f3c1a73223f1410eb0'
  type: city
  name: Iriesa
  description: |-
    Iriesa è una città dello stato di Liberia costruita su un isolotto corallino del Calemark, in mezzo all'Oceano Ladows. Vive quasi solo del mare, fra pesca, cantieri e scali per la flotta commerciale. I mercanti di Liberia vi tengono magazzini lontani dagli occhi dei curiosi.
