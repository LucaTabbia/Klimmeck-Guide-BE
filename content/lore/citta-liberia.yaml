  type: city
  name: Ridale
  description: |-
    Ridale è un villaggio dello stato di Liberia su un'isola boscosa del Calemark. I contadini che vi abitano sono fra i più poveri dello stato. Un portale demoniaco aperto fra gli alberi ha reso il bosco un luogo da evitare.
