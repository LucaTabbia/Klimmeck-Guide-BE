  type: city
  name: Altaluce
  description: |-
    Altaluce è un villaggio dello stato di Liberia su un'isola del Calemark. Un antico faro sulla scogliera guida le navi fra i fondali bassi e corallini. Gli abitanti vivono di pesca e del servizio ai piloti della flotta.
