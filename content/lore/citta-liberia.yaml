- id: '6ae809f3c1a73223f1410eb6'
  type: city
  name: Tine
  description: |-
    Tine è una città dello stato di Liberia su un'isola bassa del Calemark, circondata da fondali corallini. I suoi pescatori conoscono ogni secca dell'arcipelago. Un sotterraneo sotto il faro alimenta le storie sui tesori della gilda criminale.
