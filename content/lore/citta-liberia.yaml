- id: '6ae809f3c1a73223f1410eb4'
  type: city
  name: Pontemaggiore
  description: |-
    Pontemaggiore è una città dello stato di Liberia sorta attorno al più grande dei ponti semi mobili della Rete dei ponti. Mercati e locande occupano le sue campate e la rendono un crocevia di mercanti. Le navi della flotta passano sotto i suoi archi dirette all'Oceano Ladows.
