  type: city
  name: Voling
  description: |-
    Voling è una città dello stato di Liberia sulle coste calde del Calemark. Vive di pesca e dei traffici della flotta commerciale. I suoi moli sono il primo approdo delle navi che arrivano dall'Oceano Ladows.
