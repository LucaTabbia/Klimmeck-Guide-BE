  type: city
  name: Efragos
  description: |-
    Efragos è un villaggio di pescatori dello stato di Liberia su un isolotto del Calemark. Le sue barche escono sull'Oceano Ladows quando le correnti lo permettono. Il pescato raggiunge ogni giorno i mercati della capitale.
