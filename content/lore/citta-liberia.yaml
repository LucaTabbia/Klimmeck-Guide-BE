  type: city
  name: Sodiff
  description: |-
    Sodiff è un villaggio dello stato di Liberia affacciato sull'Oceano Ladows. Le sue saline e i suoi essiccatoi di pesce riforniscono la flotta per i lunghi viaggi. Gli abitanti sono noti per la parlantina e per le canzoni da marinaio.
