  name: Lushire
  description: |-
    Lushire è una città dello stato di Liberia su un'isola del Calemark. Le ville dei ricchi mecenati si affacciano sulle sue coste calde e floride. Fra i giardini affiorano le rovine di un insediamento più antico della città stato.
