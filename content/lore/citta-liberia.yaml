  type: city
  name: Fraponte
  description: |-
    Fraponte è un villaggio dello stato di Liberia nato fra due campate della Rete dei ponti. Le sue case di legno sono appese ai piloni sopra il mare. Vive dei pedaggi e del piccolo commercio con i viandanti.
