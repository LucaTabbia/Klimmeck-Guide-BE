  type: city
  name: Woln
  description: |-
    Woln è un villaggio dello stato di Liberia nell'interno di un'isola agricola del Calemark. I suoi campi riforniscono di grano e frutta la città stato. Un piccolo cimitero accanto ai campi raccoglie le famiglie contadine dell'isola.
