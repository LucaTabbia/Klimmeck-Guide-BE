- id: '6ae809f3c1a73223f1410eb7'
  type: city
  name: Vinas
  description: |-
    Vinas è una città dello stato di Liberia su un'isola boschiva del Calemark, dedicata all'agricoltura. Le sue vigne e i suoi orti sfamano in parte la capitale. Un portale demoniaco nel bosco è sorvegliato da mercenari pagati dalla Banca Faris.
