  type: city
  name: Portominore
  description: |-
    Portominore è una città di porto dello stato di Liberia nel Calemark. Accoglie le navi più piccole che non trovano posto nel grande porto della capitale. Le sue colline boscose sono coltivate dalla popolazione meno abbiente dello stato.
