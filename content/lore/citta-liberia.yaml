- id: '6ae809f3c1a73223f1410eb3'
  type: city
  name: Pontealto
  description: |-
    Pontealto è una città dello stato di Liberia unita alle isole vicine da un ponte della Rete dei ponti, alto sopra le correnti. Sulle sue arcate si affollano case e botteghe. Nella parte boscosa dell'isola si apre un sotterraneo usato un tempo dai contrabbandieri.
