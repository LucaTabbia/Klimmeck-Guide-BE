- id: '6ae8001b906eac0adda59a37'
  type: character
  name: Alexander Themoira I
  description: |-
    Povero contadino ai piedi del Temistos, a vent'anni fu scelto dalla dea Mirwa come suo amante ed eletto; visse fra il 530 della terza era e il 20 della quarta. Riunì i villaggi vicini, ancora distrutti dalla guerra, e fondò Mirwen sull'isola di Hingtos, allora un piccolo villaggio di pescatori. Primo Alto Sacerdote del culto, vide la città diventare una fortezza popolosa e il Temistos rifiorire. È ricordato come un sovrano buono e visionario.
  image: null
