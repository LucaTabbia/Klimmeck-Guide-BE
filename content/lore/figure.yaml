- id: '6ae8001b906eac0adda59a3c'
  type: character
  name: Wismund Drustea
  description: |-
    Re del Regno di Drustea, nato nel 973 della sesta era, è un guerriero capace e un uomo severo che pensa quasi solo al futuro del paese. Con i pericoli del nord alle porte rafforza soprattutto l'esercito, ma investe anche in banche, nuove terre coltivabili e commerci. Il matrimonio con un'elfa di una delle famiglie più importanti del Minnely ha acceso il dissenso degli elfi tradizionalisti. Ama il figlio Kolvar, ma glielo mostra solo con un severo interesse per le sue doti di guerriero e di capo.
  image: null
  relatedLore:
    - '6ae7fc3ed1f6494f3dc89f50' # Regno di Drustea
