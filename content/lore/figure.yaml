- id: '6ae8001b906eac0adda59a41'
  type: character
  name: Horzazu, la guida suprema
  description: |-
    Capo dei Draconidi dei monti Lamstone e lo sciamano più potente della sua specie, nato nel 965 della sesta era. In comunione con la natura, è un capo saggio, calmo e lungimirante, aperto agli stranieri e al commercio con il Regno della Madre. Sotto la sua guida i villaggi crescono senza faide. Riconosce l'autorità di Skargen e si riserva solo di scegliere la strada migliore per il suo popolo.
  image: null
  relatedLore:
