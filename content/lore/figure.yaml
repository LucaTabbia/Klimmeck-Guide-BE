- id: '6ae8001b906eac0adda59a4a'
  type: character
  name: Reavor Kyrell
  description: |-
    Il giovane locandiere di Talmvere è un mezz'elfo che ama ridere, scherzare e prendersi cura della locanda e dei suoi avventurieri. Da bambino fuggì con la madre dal villaggio natale distrutto dai Goblin; rimasto orfano, fu cresciuto da un anziano avventuriero ai margini del villaggio, che gli insegnò a combattere. Gestisce tutte le richieste di caccia dei dintorni e, dopo anni di viaggi, ha contatti ovunque. Si dice che il suo passato nasconda più di un mistero.
  image: null
