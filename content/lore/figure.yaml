- id: '6ae8001b906eac0adda59a39'
  type: character
  name: Skargen Monteaspro III
  description: |-
    Il fabbro più talentuoso delle ultime due ere, scelto da Naleala come eletto dopo oltre mille anni e oggi re e capo spirituale del Regno della Madre. Ha riportato all'antica gloria la forgiatura delle rune, ampliato le Vene della madre e reso più vantaggiosi i commerci con l'esterno. Nato nel 939 della sesta era e ormai vicino alla morte, addestra la figlia prediletta Terean perché gli succeda, scatenando la gelosia degli altri nove figli. È un uomo burbero, che preferisce i suoi martelli alla compagnia della famiglia.
  image: null
