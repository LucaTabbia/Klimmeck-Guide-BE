- id: '6ae8001b906eac0adda59a47'
  type: character
  name: Azorius Telob
  description: |-
    Capo del popolo Telob da quando aveva 22 anni, nato nel 994 della sesta era, ha fatto di Telobren la base di uno dei gruppi armati più capaci del Belleholm. Il carattere bellicoso, in parte frutto della sua fede in Fasmos, lo mette spesso contro i capi dei Phalan e dei Kerring, ma il suo obiettivo è un'Unione più forte e più grande. Mezz'elfo stratega, guerriero rapido e rissaiolo rinomato, preferisce comunque imporsi con la forza d'animo che con le mani. Si dice che sia l'amante di Guerin Kerring.
