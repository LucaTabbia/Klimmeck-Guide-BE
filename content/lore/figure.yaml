- id: '6ae8001b906eac0adda59a36'
  type: character
  name: Hilword Valantar
  description: |-
    Eroe leggendario vissuto fra il 460 e il 540 della terza era, capostipite dei Valan ed eletto di Aphine. Guidò l'Alleanza di Klimmeck contro i draghi del nord e, dopo due anni di guerra, sfidò in duello Amaerith, il Re dei draghi rossi. Con il braccio sinistro stretto fra le fauci del drago, gli piantò la spada nell'occhio fino al cervello e pose fine alla Guerra del grande drago. Sulle macerie della capitale dell'Impero Ekonem sorse in suo onore la città di Valantar.
  image: null
