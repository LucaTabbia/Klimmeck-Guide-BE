- id: '6ae8001b906eac0adda59a4c'
  type: character
  name: Solomon Quill
  description: |-
    Nobile elfo di Liberia nato nel 413 della seconda era, è uno degli elfi più antichi esistenti e uno dei vampiri più potenti del continente. Si dice che sia diventato un vampiro completo solo dopo aver ucciso il proprio padrone. Cerca senza sosta un modo per tornare a camminare sotto il sole, accrescendo il suo potere con nuova progenie e patti con i Diavoli più potenti. Molti nobili lo riveriscono sperando di diventare vampiri, ma la sua vera natura resta un segreto della sua cerchia; è il gemello di Alice Quill.
