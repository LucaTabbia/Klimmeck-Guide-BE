- id: '6ae8001b906eac0adda59a3f'
  type: character
  name: Orgeal Indrek, il Dio dei morti
  description: |-
    Un tempo il mago più potente del consiglio degli Alti Savi dell'Impero Ekonem, Orgeal creò il primo Filatterio e rinunciò alla propria umanità per continuare a imparare oltre la morte. Millenni di studio e la vicinanza alle arti oscure e all'Abisso ne hanno corrotto l'animo, e oggi governa la Città Non-Morta con un esercito di Ghoul, Wraith, Fantasmi e Lich. La sua potenza immortale ne ha fatto una divinità venerata da necromanti e non morti, ma disprezzata dagli altri dei perché un tempo era umano. Non gli interessano i regni di Klimmeck: vuole sfidare e superare le altre divinità, con macchinazioni segrete e contorte di cui pochi avvertono l'influenza.
  image: null
