- id: '6ae8001b906eac0adda59a42'
  type: character
  name: Tanelia Ularen
  description: |-
    Fabbro runico di immenso talento nata nel 54 della quinta era, fu scelta da Naleala come sua eletta e divenne regnante del Regno della Madre. Grazie a lei i Tiefling, odiati per le loro origini demoniache, cominciarono a essere accolti come parte della comunità. Donna grezza e solare, dalla parlantina coinvolgente, avviò la collaborazione con i Draconidi e rapporti pacifici con gli Aarakocra. Con lei il Regno della Madre divenne il più multiculturale del continente e il rifugio delle razze senza una casa.
  image: null
