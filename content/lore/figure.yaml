- id: '6ae8001b906eac0adda59a3d'
  type: character
  name: Hercia Drustea
  description: |-
    Regina del Regno di Drustea, nata nel 322 della sesta era in una delle famiglie elfiche più importanti del Minnely, di cui ha abbandonato eredità e cognome per sposare Wismund. Lo conobbe quando il giovane re visitò la foresta e ne fu conquistata dal fascino austero e dal corteggiamento incessante. Il matrimonio ha diviso la sua famiglia e il suo popolo, ma ha avvicinato elfi e uomini. Elfa elegante dalla pelle chiarissima e dai capelli arancioni, ha un canto così bello che si dice abbia fatto innamorare Iarus.
  image: null
