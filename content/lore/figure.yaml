- id: '6ae8001b906eac0adda59a38'
  type: character
  name: Alexander Themoira XXI
  description: |-
    Discendente di Alexander Themoira I, è il quarto della stirpe scelto da Mirwa come eletto e il secondo a diventarne amante. Suo padre, Alexander XX, fu abbandonato dalla dea dopo la nascita del figlio nel 1002 della sesta era e da allora gli porta rancore. Sovrano giusto e amato, attento ai più deboli, vede comunque la sua autorità messa in dubbio, anche perché l'amore per Mirwa gli impedisce di sposarsi e avere eredi. Oggi indaga su un gruppo di traditori che vorrebbe rimettere il padre al potere.
