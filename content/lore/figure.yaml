- id: '6ae8001b906eac0adda59a40'
  type: character
  name: Urvinass, il non-morto
  description: |-
    Secondo e ultimo Re dei draghi rossi, nato alla fine della seconda era e ritenuto più forte perfino di Amaerith. Dopo la Guerra del grande drago, con la sua specie vicina all'estinzione, cercò un potere oltre la morte e nella quinta era legò la sua anima a un Filatterio, diventando un Lich. Sfidò Orgeal per prenderne il posto, ma fu sconfitto con facilità e finì per mettersi al suo servizio. Dopo secoli è il suo braccio destro e attende il giorno in cui il padrone gli concederà il dominio sul continente.
  image: null
