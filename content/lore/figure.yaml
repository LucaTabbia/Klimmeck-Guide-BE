- id: '6ae8001b906eac0adda59a44'
  type: character
  name: Amaerith, il fuoco rosso
  description: |-
    Re dei draghi rossi nato all'inizio della prima era, scatenò la Guerra del grande drago e distrusse l'Impero Ekonem. Convinto della superiorità della sua razza, che dai picchi del Lamstone dominava i cieli, voleva governare l'intero continente. Lo fermarono solo l'Alleanza di Klimmeck e l'eroe Hilword Valantar, che lo uccise in duello. Si dice fosse più alto delle mura dell'odierna Valantar e che l'ombra delle sue ali coprisse interi villaggi.
  image: null
