- id: '6ae8001b906eac0adda59a3e'
  type: character
  name: Kolvar Drustea
  description: |-
    Principe del Regno di Drustea, nato nel 1008 della sesta era, è un mezz'elfo cagionevole che ha passato gran parte della vita a letto studiando e dipingendo. Non potendo addestrarsi alla guerra come vorrebbe il padre, si sente un peso e poco amato. Il suo animo gentile e l'interesse per il regno fanno sperare in un buon sovrano, anche se il popolo vede in lui la fine della dinastia. È affezionatissimo al suo caprone Tumble.
  image: null
