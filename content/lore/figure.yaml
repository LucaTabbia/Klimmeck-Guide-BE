- id: '6ae8001b906eac0adda59a46'
  type: character
  name: Raybaut Phalan
  description: |-
    Capo del popolo Phalan e discepolo di Oaldir, nato nel 987 della sesta era, possiede a Bellport una delle compagnie commerciali più importanti del continente. Più che una guida è consigliere e tesoriere del suo popolo, che aiuta senza influire sulle sue scelte, come vorrebbe Oaldir. Sereno e dalla risata fragorosa, nasconderebbe però un lato oscuro: i pirati della zona sembrano colpire solo le navi delle compagnie rivali. Lui sostiene di aver solo stretto patti economici per proteggere le sue navi; ha una figlia piccola.
  image: null
