- id: '6ae8001b906eac0adda59a45'
  type: character
  name: Guerin Kerring
  description: |-
    Giovane donna nata nel 1001 della sesta era, guida il popolo Kerring da Virnen dopo la morte prematura del padre. Bella, caparbia e a volte meschina, è discepola di Mezaldir e di Itris: usa il suo fascino per ottenere ciò che vuole e istruisce i più giovani perché un giorno governino meglio di lei. È spesso in conflitto con Azorius Telob, anche se si dice che siano amanti. Convinta che il padre sia stato avvelenato da un traditore, diffida di chiunque la circondi.
  image: null
