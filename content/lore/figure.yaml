- id: '6ae8001b906eac0adda59a48'
  type: character
  name: Grande capo Ashen
  description: |-
    Capo del più numeroso gruppo di nomadi Aarakocra del Temistos e il più anziano membro conosciuto della sua specie, nato nel 972 della sesta era. Fu un cacciatore abile, ma con gli anni le sue ali si sono fatte stanche, e oggi la sua saggezza decide le mete in cui il popolo cerca cibo e riparo. Poco socievole con gli estranei, accetta comunque di commerciare e di ospitare i viandanti per brevi periodi. Non perdona chi attacca il suo popolo e punisce con l'esilio gli Aarakocra che depredano le carovane.
  image: null
