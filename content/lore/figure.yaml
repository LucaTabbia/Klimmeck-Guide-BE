# Figure storiche e presenti di Klimmeck (D-23): una scheda character per figura, collegata a regno, regione, culto ed era

- id: '6ae8001b906eac0adda59a35'
  type: character
  name: Dummel Regis
  description: |-
    Mercante vissuto fra il 206 e il 272 della quinta era, fondò l'Alleanza del Mare e il Consiglio di Dummel. Il suo impero di commerci per mare e per fiume rese le città marittime del Regno di Drustea abbastanza ricche da separarsi senza spargimento di sangue, in cambio di commerci senza dazi verso Cliffbreak e della Tassa di scissione. Per evitare contese fra le città affidò leggi e commerci a un consiglio dei mercanti più importanti. Fu il primo a costruire navi leggere da fiume, ebbe molti matrimoni e moltissimi figli, e la sua Alleanza restò libera per oltre nove secoli.
  image: null
