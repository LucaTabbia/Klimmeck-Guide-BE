- id: '6ae8001b906eac0adda59a3b'
  type: character
  name: Rufus Faris
  description: |-
    Uno degli uomini più ricchi e influenti del continente, è capo e tesoriere della città stato di Liberia e proprietario della Banca Faris, fondata nell'842 della quinta era dal suo antenato Malon Faris. Libertino e di ampie vedute, guida la città con occhio progressista. Le sue ricchezze vengono dalle molte attività cittadine e dalla banca, ma si sussurra anche di affari illeciti. Si dice che la famiglia Faris guidi in segreto, tramite terzi, una gilda di ladri nascosta nelle rovine sotto Valantar.
  image: null
