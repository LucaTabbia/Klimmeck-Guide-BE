- id: '6ae8001b906eac0adda59a4e'
  type: character
  name: Winmore Lobo
  description: |-
    Nato nel 1089, un tempo mercante e marinaio, fondò una compagnia di mercenari che difendeva le navi commerciali dell'Alleanza del Mare. Con la riannessione dell'Alleanza al Regno di Drustea la compagnia si sciolse e la sua fortuna, come quella di amici e mercanti, andò in fumo. Oggi guida la ribellione contro il regno, per liberare l'Alleanza e combattere la supremazia commerciale di Liberia, che ritiene una minaccia per l'equilibrio fra le nazioni.
