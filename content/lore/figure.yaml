- id: '6ae8001b906eac0adda59a49'
  type: character
  name: Aravae Miel
  description: |-
    La Signora della foresta, nata nel 239 della terza era, guida la famiglia più influente degli elfi del Minnely ed è l'eletta di Enayr. Maga potentissima, mantiene sempre attiva la barriera che nasconde il luogo dove vivono gli elfi. Fra le poche sostenitrici di Hercia, cerca di aprire gli occhi al popolo elfico ancora legato alle vecchie tradizioni. Da giovane si innamorò di Hilword Valantar e non ne ha mai dimenticato il volto; il suo carattere giocoso nasconde il dolore di aver visto morire i propri eredi mezzi umani.
