- id: '6ae8001b906eac0adda59a4b'
  type: character
  name: Jur'gath, il signore dei demoni
  description: |-
    Il più potente e malvagio dei Diavoli e loro re, governa con il pugno di ferro da Flamemourne, uccidendo e schiavizzando chiunque intralci la sua strada. Astuto e intelligente, non vuole conquistare il Piano Materiale: attacchi e assedi sono per lui solo amore per il caos e la sofferenza. Si dice che abbia dei luogotenenti, ma nessuno sa quanti siano né quali compiti abbiano. Ciò che si sa viene dai Tiefling fuggiti, e ogni portale demoniaco che si apre è il segno di uno dei suoi piani crudeli.
