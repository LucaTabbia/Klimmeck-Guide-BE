- id: '6ae8001b906eac0adda59a4d'
  type: character
  name: Alice Quill
  description: |-
    Nobile elfa di Liberia nata nel 413 della seconda era, gemella di Solomon Quill, è una degli elfi più antichi e uno dei vampiri più potenti del continente. Anche lei sarebbe diventata un vero vampiro uccidendo il proprio padrone. A differenza del fratello non desidera tornare alla luce del sole: ama il potere conquistato e lo usa per vivere nell'agio e soddisfare ogni desiderio. Molti nobili la riveriscono sperando di diventare vampiri, ma solo la sua cerchia conosce la sua vera natura.
