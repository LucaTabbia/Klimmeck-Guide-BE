- id: '6ae8001b906eac0adda59a43'
  type: character
  name: Vozaed Ferroscuro
  description: |-
    Eroe nanico della Guerra del sottosuolo, nato si dice alla fine della prima era, quando ancora non esistevano regni. Riunì sotto una sola bandiera i popoli nanici, fino ad allora divisi, contro le orde di Goblin e Hobgoblin delle profondità del Lamstone. Le sue gesta si sono perse nel tempo: c'è chi lo dice morto in guerra, chi fondatore del Regno della Madre e chi pensa non sia mai esistito. Si racconta che con un solo colpo tagliò la testa a tre troll.
  image: null
