- id: '6ae8001b906eac0adda59a3a'
  type: character
  name: Venis Millhelm
  description: |-
    Il Bardo delle leggende accompagnò Hilword Valantar in guerra, prima come cantore e poi come amico, e si dice che una volta gli abbia salvato la vita. È l'Halfling più famoso di sempre e le sue canzoni risuonano ancora in ogni locanda. Finita la guerra fondò il Collegio Millhelm nel suo villaggio natale, che grazie al collegio crebbe fino a diventare una delle fondamenta di Liberia. Seduttore rinomato con più di mille amanti, si dice che Iarus in persona si sia esibito con lui.
  image: null
